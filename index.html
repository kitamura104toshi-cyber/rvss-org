function addMember() {
  const areaOpts = AREA_LIST.map(a => `<option value="${a}">${a}</option>`).join("");
  openModal(`
    <h3>新メンバーを登録</h3>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">名前 <span style="color:var(--pink-text)">*</span></label>
    <input id="nm-name" placeholder="氏名"/>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">大学名</label>
    <input id="nm-univ" placeholder="例：京都大学"/>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">エリア</label>
    <select id="nm-area">
      <option value="">（未設定）</option>
      ${areaOpts}
    </select>
    <div class="actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" id="nm-ok">登録</button>
    </div>
  `);
  const nameInput = document.getElementById("nm-name");
  nameInput.focus();
  const submit = () => {
    const name = (document.getElementById("nm-name").value || "").trim();
    if (!name) return;
    if (state.members.includes(name)) { alert("既に存在します"); return; }
    const univ = (document.getElementById("nm-univ").value || "").trim();
    const area = document.getElementById("nm-area").value;
    state.members.push(name);
    if (univ || area) {
      if (!state.memberOverrides) state.memberOverrides = {};
      state.memberOverrides[name] = { university: univ, area: area };
    }
    save(); closeModal(); render();
  };
  document.getElementById("nm-ok").onclick = submit;
  nameInput.onkeydown = (e) => { if (e.key === "Enter") document.getElementById("nm-univ").focus(); };
}
function deleteMember(name) {
  confirmDialog(`${name} を退会扱いにしますか？（全アサインから除外します。退会者リストから復元可能）`, () => {
    state.members = state.members.filter(n => n !== name);
    // MEMBER_INFO由来でも非表示にできるよう削除リストに追加
    if (!state.deletedMembers) state.deletedMembers = [];
    if (!state.deletedMembers.includes(name)) state.deletedMembers.push(name);
    state.projects.forEach(p => {
      p.mentors = p.mentors.filter(m => m.name !== name);
      p.students = p.students.filter(m => m.name !== name);
      if (p.groups) p.groups.forEach(g => { g.members = g.members.filter(m => m.name !== name); });
    });
    state.departments.forEach(d => {
      if (d.lead) d.lead = d.lead.filter(m => m.name !== name);
      if (d.groups) d.groups.forEach(g => {
        g.members = g.members.filter(m => m.name !== name);
        if (g.subGroups) g.subGroups.forEach(sg => { sg.members = sg.members.filter(m => m.name !== name); });
      });
    });
    (state.schools||[]).forEach(s => {
      if (s.tl === name) s.tl = "";
      if (s.subTl === name) s.subTl = "";
      s.students = s.students.filter(n => n !== name);
    });
    if (state.memberOverrides && state.memberOverrides[name]) delete state.memberOverrides[name];
    save(); render();
  });
}
function restoreMember(name) {
  if (!state.deletedMembers) return;
  state.deletedMembers = state.deletedMembers.filter(n => n !== name);
  if (!state.members.includes(name) && !MEMBER_INFO[name]) {
    state.members.push(name);
  }
  save(); render();
}
// NDA・業務委託契約はそれぞれ独立に締結・未締結を管理する（同時に両方締結済みもあり得る）
const CONTRACT_TAG_STYLE_OFF = "background:#fff;color:#6b6b6b;border:1px solid #e5e3dc";
const CONTRACT_TAG_STYLE_NDA_ON = "background:var(--green,#e6f4ea);color:var(--green-text,#2f7d4a)";
const CONTRACT_TAG_STYLE_OUTSOURCING_ON = "background:var(--blue,#e8f0fe);color:var(--blue-text,#1a56c4)";
// NDAは契約シートのF列「NDA締結（確認中）」だけを見る。チェックが付いていれば締結完了。
function ndaStatusTagHTML(name, mi) {
  const s = !!(mi && mi.ndaSigned);
  return `<span class="tag editable" style="${s ? CONTRACT_TAG_STYLE_NDA_ON : CONTRACT_TAG_STYLE_OFF}" onclick="toggleNdaSigned('${name}')" title="クリックで切り替え">${s ? "✅ NDA締結完了" : "NDA未締結"}</span>`;
}
function outsourcingStatusTagHTML(name, signed) {
  const s = !!signed;
  return `<span class="tag editable" style="${s ? CONTRACT_TAG_STYLE_OUTSOURCING_ON : CONTRACT_TAG_STYLE_OFF}" onclick="toggleOutsourcingSigned('${name}')" title="クリックで切り替え">${s ? "✅ 業務委託契約締結済み" : "業務委託契約未締結"}</span>`;
}
function toggleNdaSigned(name) {
  const current = memberInfo(name) || {};
  if (!state.memberOverrides) state.memberOverrides = {};
  state.memberOverrides[name] = Object.assign(
    { university: "", area: "", experience: "", skills: "", canDo: "", wantToDo: "" },
    current,
    { ndaSigned: !current.ndaSigned }
  );
  save(); render();
}
function toggleOutsourcingSigned(name) {
  const current = memberInfo(name) || {};
  if (!state.memberOverrides) state.memberOverrides = {};
  state.memberOverrides[name] = Object.assign(
    { university: "", area: "", experience: "", skills: "", canDo: "", wantToDo: "" },
    current,
    { outsourcingSigned: !current.outsourcingSigned }
  );
  save(); render();
}

// 契約期間（1年ごとに自動更新）の残り日数。contractStartDate（契約締結日 or 直近更新日）を起算点に、
// 今日以降で最も近い「毎年の応当日」を次回更新日とみなして計算する。
function contractRenewalInfo(contractStartDate) {
  if (!contractStartDate) return null;
  const start = new Date(contractStartDate + "T00:00:00");
  if (isNaN(start.getTime())) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let next = new Date(today.getFullYear(), start.getMonth(), start.getDate());
  if (next < today) next.setFullYear(next.getFullYear() + 1);
  const days = Math.round((next - today) / 86400000);
  const nextLabel = `${next.getFullYear()}/${next.getMonth()+1}/${next.getDate()}`;
  return { days, nextLabel };
}
// 残り活動期間。知りたいのは契約の更新日ではなく「いつまで在籍するか」なので、
// 卒業タイミングのヒアリング結果を本文にし、契約の更新日は補足として下に添える。
function contractRemainingHTML(mi) {
  const m = mi || {};
  const left = monthsUntilYM(m.availableUntil);
  const phrase = tenurePhrase(m.tenureIntent || "", left, tenureDateLabel(m.availableUntil));
  const note = (m.availableUntilNote || "").trim();
  const info = contractRenewalInfo(m.contractStartDate);
  const sub = info ? `契約更新 ${info.nextLabel}（残り${info.days}日）` : "";
  return `
    <div class="section-label">残り活動期間</div>
    <div style="font-size:13px;line-height:1.6;color:${phrase ? "var(--text)" : "var(--muted)"}">${phrase ? escapeHtml(phrase) : "未確認"}</div>
    ${note ? `<div style="font-size:12px;line-height:1.6;color:var(--muted)">${escapeHtml(note)}</div>` : ""}
    ${m.handoverNeeded ? `<div style="font-size:12px;line-height:1.6;color:var(--orange-text)">引き継ぎ対応が必要</div>` : ""}
    <div style="font-size:12px;line-height:1.6;margin-bottom:10px;color:var(--muted)">${sub ? escapeHtml(sub) : ""}</div>
  `;
}
// 前月稼働時間（Notionの稼働管理表と連携して自動反映される想定。手動編集も可）
function workloadHTML(lastMonthHours) {
  const has = typeof lastMonthHours === "number";
  const value = has ? `${lastMonthHours}時間` : "";
  return `
    <div class="section-label">前月稼働時間</div>
    <div style="font-size:13px;line-height:1.6;margin-bottom:10px;color:${value ? "var(--text)" : "var(--muted)"}">${value ? escapeHtml(value) : "未設定"}</div>
  `;
}
function editMember(name) {
  const current = memberInfo(name) || { university: "", area: "" };
  const areaOpts = AREA_LIST.map(a => `<option value="${a}"${current.area===a?" selected":""}>${a}</option>`).join("");
  openModal(`
    <h3>${escapeHtml(name)} の情報を編集</h3>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">大学名</label>
    <input id="em-univ" value="${escapeHtml(current.university||"")}" placeholder="例：京都大学"/>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">エリア</label>
    <select id="em-area">
      <option value="">（未設定）</option>
      ${areaOpts}
    </select>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">名前</label>
    <input id="em-name" value="${escapeHtml(name)}" placeholder="名前を変更する場合のみ書き換え"/>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">状態（休会中・退会準備中など。通常は空欄）</label>
    <input id="em-status" value="${escapeHtml(current.status||"")}" placeholder="例：退会準備中" list="em-status-options"/>
    <datalist id="em-status-options">
      <option value="休会中"></option>
      <option value="退会準備中"></option>
    </datalist>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">契約開始日（1年ごとに自動更新）</label>
    <input id="em-contract-start" type="date" value="${escapeHtml(current.contractStartDate||"")}"/>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">継続意思</label>
    <select id="em-intent">
      <option value=""${!current.tenureIntent?" selected":""}>（未確認）</option>
      <option value="継続"${current.tenureIntent==="継続"?" selected":""}>継続</option>
      <option value="卒業"${current.tenureIntent==="卒業"?" selected":""}>卒業</option>
    </select>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">残り活動期間（いつまで活動するか。年月、または年月日）</label>
    <input id="em-until" value="${escapeHtml(current.availableUntil||"")}" placeholder="例：2027-03-31"/>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">継続予定期間・コメント</label>
    <input id="em-until-note" value="${escapeHtml(current.availableUntilNote||"")}" placeholder="例：大学卒業まで／留年したら継続"/>
    <label style="font-size:13px;display:flex;align-items:center;gap:6px;margin:10px 0">
      <input id="em-handover" type="checkbox" ${current.handoverNeeded?"checked":""} style="width:auto"/> 引き継ぎ対応が必要
    </label>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">前月稼働時間（h）｜通常はNotionと連携して自動更新</label>
    <input id="em-workload" type="number" min="0" step="0.5" value="${current.lastMonthHours!=null?current.lastMonthHours:""}" placeholder="例：45"/>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">趣味</label>
    <input id="em-hobby" value="${escapeHtml(current.hobby||"")}" placeholder="例：旅行、ダンス、ドライブ"/>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">経験</label>
    <textarea id="em-experience" rows="2" placeholder="これまでの経験（インターン・部活・制作物など）">${escapeHtml(current.experience||"")}</textarea>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">スキル</label>
    <textarea id="em-skills" rows="2" placeholder="得意なスキル（デザイン・プログラミングなど）">${escapeHtml(current.skills||"")}</textarea>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">やりたいこと</label>
    <textarea id="em-wantto" rows="2" placeholder="今後挑戦したいこと">${escapeHtml(current.wantToDo||"")}</textarea>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">尊敬する人</label>
    <input id="em-admires" value="${escapeHtml(current.admires||"")}" placeholder="例：両親"/>
    <div class="actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" onclick="saveMemberEdit('${name}')">保存</button>
    </div>
  `);
}
function saveMemberEdit(oldName) {
  const univ = (document.getElementById("em-univ").value||"").trim();
  const area = document.getElementById("em-area").value;
  const newName = (document.getElementById("em-name").value||"").trim() || oldName;
  const status = (document.getElementById("em-status").value||"").trim();
  const contractStartDate = document.getElementById("em-contract-start").value || "";
  const availableUntil = (document.getElementById("em-until").value||"").trim();
  const availableUntilNote = (document.getElementById("em-until-note").value||"").trim();
  const tenureIntent = document.getElementById("em-intent").value;
  const handoverNeeded = document.getElementById("em-handover").checked;
  const workloadRaw = document.getElementById("em-workload").value;
  const lastMonthHours = workloadRaw === "" ? null : Number(workloadRaw);
  const experience = (document.getElementById("em-experience").value||"").trim();
  const skills = (document.getElementById("em-skills").value||"").trim();
  const wantToDo = (document.getElementById("em-wantto").value||"").trim();
  const hobby = (document.getElementById("em-hobby").value||"").trim();
  const admires = (document.getElementById("em-admires").value||"").trim();
  if (!state.memberOverrides) state.memberOverrides = {};

  // 名前変更があれば全アサインの参照も更新
  if (newName !== oldName) {
    if (state.memberOverrides[oldName]) {
      state.memberOverrides[newName] = state.memberOverrides[oldName];
      delete state.memberOverrides[oldName];
    }
    state.members = state.members.map(n => n === oldName ? newName : n);
    if (!state.members.includes(newName) && !MEMBER_INFO[newName]) state.members.push(newName);
    state.projects.forEach(p => {
      p.mentors.forEach(m => { if (m.name === oldName) m.name = newName; });
      p.students.forEach(m => { if (m.name === oldName) m.name = newName; });
      if (p.groups) p.groups.forEach(g => g.members.forEach(m => { if (m.name === oldName) m.name = newName; }));
    });
    state.departments.forEach(d => {
      if (d.lead) d.lead.forEach(m => { if (m.name === oldName) m.name = newName; });
      if (d.groups) d.groups.forEach(g => {
        g.members.forEach(m => { if (m.name === oldName) m.name = newName; });
        if (g.subGroups) g.subGroups.forEach(sg => sg.members.forEach(m => { if (m.name === oldName) m.name = newName; }));
      });
    });
    (state.schools||[]).forEach(s => {
      if (s.tl === oldName) s.tl = newName;
      if (s.subTl === oldName) s.subTl = newName;
      s.students = s.students.map(n => n === oldName ? newName : n);
    });
  }

  // プロフィール情報のoverride保存（契約状況・BSバッジ・スキル分類は編集フォーム対象外なので保持する）
  const ndaSigned = (state.memberOverrides[newName] || {}).ndaSigned;
  const outsourcingSigned = (state.memberOverrides[newName] || {}).outsourcingSigned;
  const isBS = (state.memberOverrides[newName] || {}).isBS;
  const skillCategories = (state.memberOverrides[newName] || {}).skillCategories;
  if (!univ && !area && !status && !contractStartDate && !availableUntil && !availableUntilNote && !tenureIntent && !handoverNeeded && lastMonthHours == null && !experience && !skills && !wantToDo && !hobby && !admires && !ndaSigned && !outsourcingSigned && !isBS && !skillCategories) {
    delete state.memberOverrides[newName];
  } else {
    state.memberOverrides[newName] = { university: univ, area: area, status, contractStartDate, availableUntil, availableUntilNote, tenureIntent, handoverNeeded, lastMonthHours, experience, skills, wantToDo, hobby, admires, ndaSigned, outsourcingSigned, isBS, skillCategories };
  }
  save(); closeModal(); render();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// 属性内に JS の引数として埋め込む。キーや名前に ' や " が含まれても壊れない。
function jsArg(s) { return escapeHtml(JSON.stringify(String(s))); }

// admin だけが実行できる操作（メンバー・PJ・部署・スクール・有償枠の編集すべて）
const ADMIN_FNS = [
  "addProject","editProject","saveProject","deleteProject","addToProject","removeFromProject",
  "addPaidMember","removePaidMember",
  "addProjectGroup","deleteProjectGroup","renameProjectGroup","addProjectGroupMember",
  "removeProjectGroupMember",
  "addDept","renameDept","addDeptLead","removeDeptLead",
  "addGroup","deleteGroup","renameGroup","addGroupMember","removeGroupMember",
  "addSubGroup","deleteSubGroup","renameSubGroup","addSubGroupMember","removeSubGroupMember",
  "addSchool","deleteSchool","setSchoolLead","addSchoolStudent","removeSchoolStudent",
  "addMember","editMember","saveMemberEdit","deleteMember","restoreMember",
  "editPayMember","savePayMember","exportPayToSheets","setPayExportShareTo",
  "editSlotMember","saveSlotMember","reorderItem",
  "toggleNdaSigned","toggleOutsourcingSigned",
  "addCustomTab","deleteCustomTab",
  "resetData",
  "backupToSheets","syncRecruitment",
];
// core 以上が実行できる操作（募集の進捗ステータスまわりだけ）
const CORE_FNS = ["setRecruitStatus", "setRecruitWebTest", "clearRecruitOverride"];

const disableFns = (names) => names.forEach(fn => {
  if (typeof window[fn] === "function") {
    window[fn] = function () { /* このロールでは実行不可 */ };
  }
});
if (!roleAtLeast("admin")) disableFns(ADMIN_FNS);
if (!roleAtLeast("core")) disableFns(CORE_FNS);

render();
</script>
