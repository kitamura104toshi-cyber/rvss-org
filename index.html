<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RVSS 組織管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --border: #e5e3dc;
    --text: #2a2a2a;
    --muted: #6b6b6b;
    --accent: #4f63d2;
    --accent-soft: #e8ecff;
    --pink: #fde9ec;
    --pink-text: #b73a4a;
    --green: #e6f4ea;
    --green-text: #2f7d4a;
    --orange: #fff1de;
    --orange-text: #a8631b;
    --blue: #e8ecff;
    --blue-text: #4f63d2;
    --purple: #efe6f7;
    --purple-text: #6a3e9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
  }
  .tab.active { background: var(--text); color: white; border-color: var(--text); }
  .tab-remove {
    margin-left: 6px;
    opacity: 0.6;
  }
  .tab-remove:hover { opacity: 1; }
  .tab-add {
    background: #fff;
    border: 1px dashed var(--border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
  }
  .tab-add:hover { background: #f0eee7; }

  .grid {
    column-count: 2;
    column-gap: 16px;
  }
  .grid > .card {
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    margin-bottom: 16px;
    display: inline-block;
    width: 100%;
  }
  @media (max-width: 560px) {
    .grid { column-count: 1; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .card-title { font-weight: 700; font-size: 16px; }
  .count-pill {
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .section-label { font-size: 12px; color: var(--muted); margin: 10px 0 6px; }

  .slot {
    background: #faf9f5;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .slot .name { font-size: 14px; font-weight: 600; }
  .slot .role { font-size: 11px; color: var(--muted); margin-top: 2px; }
  body:not(.view-mode) .slot[data-reorder-key] { cursor: grab; touch-action: none; }
  .slot.dragging { opacity: 0.5; cursor: grabbing; }
  .reorder-ghost {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    transform: translate(-50%, -100%);
    background: var(--text);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    white-space: nowrap;
  }
  .card.highlight-flash {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    transition: outline-color 1.4s ease-out;
  }
  .name-link { cursor: pointer; }
  .name-link:hover { text-decoration: underline; }
  .slot.empty {
    background: #fff;
    border-style: dashed;
    color: var(--muted);
    cursor: pointer;
    justify-content: center;
    font-size: 13px;
  }
  .slot.empty:hover { background: #f0eee7; }

  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .tag.pj { background: var(--blue); color: var(--blue-text); }
  .tag.role-統括 { background: var(--purple); color: var(--purple-text); }
  .tag.role-副統括 { background: var(--blue); color: var(--blue-text); }
  .tag.role-TL { background: var(--green); color: var(--green-text); }
  .tag.role-メンバー { background: #f0eee7; color: var(--muted); }
  .tag.editable { cursor: pointer; }
  .tag.editable:hover { outline: 1px solid var(--accent); outline-offset: 1px; }

  /* ===== 閲覧モード ===== */
  body.view-mode .editor-only { display: none !important; }
  body:not(.core-mode) .core-only { display: none !important; }
  body.view-mode .tag.editable { cursor: default; pointer-events: none; }
  body.view-mode .tag.editable:hover { outline: none; }
  body.view-mode .card-title[onclick],
  body.view-mode .group-title[onclick],
  body.view-mode .subgroup-title[onclick] { cursor: default !important; pointer-events: none; }
  .recruit-select {
    border: none; border-radius: 999px; padding: 4px 10px;
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .pay-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  .pay-table th {
    text-align: left; font-size: 11px; color: var(--muted); font-weight: 600;
    padding: 6px 10px; border-bottom: 1px solid var(--border);
  }
  .pay-table td { padding: 7px 10px; border-bottom: 1px solid #f0eee7; }
  .pay-row { cursor: pointer; }
  .pay-row:hover { background: #faf9f5; }
  .pay-detail td { background: #faf9f5; padding: 10px 24px; }
  .pay-line { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; max-width: 420px; }
  .pay-line.total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 6px; font-weight: 700; }
  .recruit-detail { margin-top: 8px; }
  .recruit-detail-v {
    font-size: 12px; line-height: 1.7; white-space: pre-wrap;
    margin-bottom: 10px; color: var(--text);
  }
  .mode-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 6px;
    font-weight: 600;
  }
  .mode-badge.view { background: #e8ecff; color: var(--blue-text); }
  .mode-badge.edit { background: #fff1de; color: var(--orange-text); }

  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .icon-btn:hover { background: #f0eee7; color: var(--pink-text); }

  .btn {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn:hover { background: #f0eee7; }
  .btn.primary { background: var(--text); color: white; border-color: var(--text); }
  .btn-add {
    width: 100%;
    margin-top: 8px;
    background: #fff;
    border: 1px dashed var(--border);
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
  }
  .btn-add:hover { background: #f0eee7; }


  .group-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 12px;
    background: #fcfbf6;
  }
  .group-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .group-title { font-weight: 700; font-size: 14px; color: var(--text); }
  .subgroup-box {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 8px;
    background: #fff;
  }
  .subgroup-title { font-weight: 600; font-size: 13px; color: var(--muted); }

  .dept-card { border-top: 4px solid var(--accent); }
  .dept-card.代表補佐室 { border-top-color: #6a3e9a; }
  .dept-card.人事 { border-top-color: #2f7d4a; }
  .dept-card.広報 { border-top-color: #b73a4a; }
  .dept-card.総務情シス { border-top-color: #a8631b; }
  .dept-card.エリア { border-top-color: #4f63d2; }
  .dept-card.スクール { border-top-color: #6a3e9a; }

  /* modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: white; border-radius: 12px; padding: 20px;
    width: 90%; max-width: 420px; max-height: 80vh; overflow: auto;
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; margin-bottom: 10px;
    font-family: inherit;
  }
  .modal textarea { resize: vertical; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .member-pick {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px;
    border: 1px solid transparent;
  }
  .member-pick:hover { background: var(--accent-soft); }

  .unassigned-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--pink); color: var(--pink-text);
    padding: 6px 12px; border-radius: 999px; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .warn {
    font-size: 12px; color: var(--pink-text); margin-top: 8px;
  }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .search {
    padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; min-width: 200px;
    font-family: inherit;
  }

  /* ===== プロジェクト募集状況 ===== */
  .sync-note { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .view-toggle { display: flex; gap: 8px; margin-bottom: 10px; }

  /* 学生ビュー：入れる枠が何個あるかを最初に読ませる */
  .open-count { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
  .open-count .num { font-size: 30px; font-weight: 700; line-height: 1; }
  .open-count .unit { font-size: 12px; }

  /* 進捗ビュー：募集〜アサインまでのどこにいるか */
  .track { display: flex; align-items: flex-start; margin: 12px 0; }
  .track .step { flex: 1; text-align: center; min-width: 0; }
  .track .bar { height: 4px; border-radius: 2px; background: var(--border); }
  .track .step + .step .bar { margin-left: 2px; }
  .track .lbl { font-size: 10px; color: var(--muted); margin-top: 5px; }
  .track .step.done .bar { background: var(--green-text); }
  .track .step.done .lbl { color: var(--green-text); }
  .track .step.current .lbl { font-size: 11px; font-weight: 700; margin-top: 4px; }
  .info-row { display: flex; gap: 8px; font-size: 13px; padding: 3px 0; }
  .info-row .k { flex: 0 0 76px; font-size: 12px; color: var(--muted); padding-top: 2px; }
  .info-row .v { flex: 1; min-width: 0; word-break: break-word; }

  /* ===== 有償枠 ===== */
  .paid-card { border-top: 4px solid var(--accent); }
  .paid-card.専任 { border-top-color: #2f7d4a; }
  .paid-card.兼任 { border-top-color: #4f63d2; }
  .paid-card.移行 { border-top-color: #a8631b; }
  .slot .concurrent { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
</style>
</head>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div id="toolbar-left"></div>
    <div>
      <button class="btn" onclick="exportJSON()">JSONエクスポート</button>

      <button class="btn editor-only" onclick="resetData()">初期化</button>

  </div>
  <div id="content"></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">

// ====== 残り活動期間（卒業・継続の意思確認） ======
// 卒業タイミングのヒアリング結果を memberOverrides に持つ。
//   tenureIntent       "卒業" | "継続" | ""（未確認）
//   availableUntil     "YYYY-MM" または "YYYY-MM-DD"（いつまで活動するか）
//   handoverNeeded     引き継ぎ対応が要るか
//   availableUntilNote 継続予定期間・コメントをまとめた自由記述
// 残り月数は保存せず都度計算する。期日そのものを持てば月をまたいでも表示が追随する。
const GRADUATION_SOON_MONTHS = 6;
function parseTenureDate(v) {
  const m = /^(\d{4})[-/](\d{1,2})(?:[-/](\d{1,2}))?$/.exec(String(v || "").trim());
  if (!m) return null;
  const mo = Number(m[2]);
  const d = m[3] ? Number(m[3]) : null;
  if (mo < 1 || mo > 12) return null;
  if (d !== null && (d < 1 || d > 31)) return null;
  return { y: Number(m[1]), m: mo, d };
}
function monthsUntilYM(v) {
  const p = parseTenureDate(v);
  if (!p) return null;
  const now = new Date();
  return (p.y - now.getFullYear()) * 12 + (p.m - (now.getMonth() + 1));
}
function tenureDateLabel(v) {
  const p = parseTenureDate(v);
  if (!p) return "";
  return `${p.y}年${p.m}月${p.d ? p.d + "日" : ""}`;
}
// 残り活動期間の1行。意思と期日を別々のバッジにせず、読んで分かる文にする。
function tenurePhrase(intent, left, date) {
  if (left === null) {
    if (intent === "卒業") return "卒業予定・時期未定";
    if (intent === "継続") return "継続予定";
    return "";
  }
  if (left < 0) {
    return intent === "卒業" ? `卒業予定日（${date}）を過ぎています` : `${date}を過ぎています`;
  }
  if (left === 0) {
    return intent === "卒業" ? `今月卒業（${date}）` : `今月まで（${date}）`;
  }
  if (intent === "卒業") return `卒業まであと${left}ヶ月（${date}）`;
  if (intent === "継続") return `${date}まであと${left}ヶ月・継続予定`;
  return `${date}まであと${left}ヶ月`;
}
// ====== リファラル ======
// 採用シートの「紹介者」列を referredBy として取り込み、そこから
// 「この人が紹介した人」を逆引きする。
// リファ成立は有償枠へ2名。無償枠への紹介は数に入らないが、誰を紹介したかは残す。
// 紹介者欄は「藤原ゆうきくん」のような自由記述なので、突き合わせは緩めに行う。
const REFERRAL_PAID_REQUIRED = 2;
function normalizeRefName(s) {
  return String(s || "")
    .replace(/[（(][^）)]*[）)]/g, "")
    .replace(/[\s　]/g, "")
    .replace(/(さん|くん|君|ちゃん)$/, "");
}
function referralsBy(name) {
  const key = normalizeRefName(name);
  if (!key) return [];
  return Object.entries(state.memberOverrides || {})
    .filter(([, v]) => v && v.referredBy && normalizeRefName(v.referredBy) === key)
    .map(([n]) => ({ name: n, paid: isPaidMember(n) }))
    .sort((a, b) => (b.paid ? 1 : 0) - (a.paid ? 1 : 0));
}
function referralStatus(name) {
  const list = referralsBy(name);
  const paid = list.filter(r => r.paid).length;
  return { list, paid, established: paid >= REFERRAL_PAID_REQUIRED };
}
// リファ情報は core 以上だけに見せる（member にはHTML自体を作らない）
function referralHTML(name, mi) {
  if (!roleAtLeast("core")) return "";
  const tags = [];
  if (mi && mi.referredBy) {
    tags.push(`<span class="tag" style="background:#f5f3ed;color:#6b6b6b;border:1px solid #e5e3dc">紹介元 ${escapeHtml(mi.referredBy)}</span>`);
  }
  const r = referralStatus(name);
  if (r.list.length) {
    const style = r.established
      ? "background:var(--green);color:var(--green-text)"
      : "background:#f5f3ed;color:#6b6b6b;border:1px solid #e5e3dc";
    const detail = r.list.map(x => `${x.name}（${x.paid ? "有償" : "無償"}）`).join("、");
    tags.push(`<span class="tag" style="${style}" title="${escapeHtml(detail)}">紹介 ${r.list.length}名・有償${r.paid}${r.established ? "・リファ成立" : ""}</span>`);
  }
  return tags.join(" ");
}

// 本番データを上書きしてしまう（オフライン・初回アクセス・fetch失敗など）。
let cloudLoaded = false;
function pushToSupabase() {
  // member（閲覧モード）は絶対にクラウドDBへ書き込まない（読み取り専用）。
  // core は募集ステータスの上書きだけ許可されており（CORE_FNS 以外は disableFns で無効化済み）、
  // その保存がクラウドに届かないと同期時に消えてしまうため、admin 限定にはしない。
  if (!roleAtLeast("core")) return;
  // クラウド読み込み完了前の保存は、ローカルの古い/初期状態で本番データを
  // 上書きしてしまう危険があるため拒否する（初回シード投入は applyRemote/fetch側で
  // cloudLoaded を先に true にしてから pushToSupabase を呼ぶので通る）。
  if (!cloudLoaded) {
    setStatus("⚠️ まだ読み込めていないため保存できません（再読み込みしてください）", "#b73a4a");
    return;
  }
  setStatus("⏳ 同期中…");
  clearTimeout(writeTimer);
  writeTimer = setTimeout(() => {
    sb.from("org_state")
      .upsert({ id: ROW_ID, data: state, updated_at: new Date().toISOString() })
      .then(({ error }) => {
        if (error) setStatus("❌ " + error.message, "#b73a4a");

      });
  }, 300);
}

  if (!s.customTabs) s.customTabs = [];
  // 有償枠は4つの大枠で固定。中身は人が編集するので、無ければ空の枠だけ用意する
  if (!s.paidGroups) s.paidGroups = PAID_CATEGORIES.map(name => ({ name, members: [] }));
  // 募集状況は sheets-recruitment-sync（Edge Function）が書き込む読み取り専用データ。
  // アプリ側からは編集しないため、未同期でも落ちないよう空で初期化しておく。
  if (!s.recruitment) s.recruitment = { syncedAt: "", rows: [] };
  // アプリ側で上書きした募集ステータス。同期（sheets-recruitment-sync）はこの層に触らないので、
  // 4時間ごとの取り込みでアプリの編集が消えることはない。
  if (!s.recruitOverrides) s.recruitOverrides = {};
  // 報酬計算用の入力値（360°評価・出席率・リファ・スクール・マネージャー・手動調整）。
  // 稼働時間だけは memberOverrides.lastMonthHours（Notion連携）を使うのでここには持たない。
  if (!s.compensation) s.compensation = { members: {} };
  if (!s.compensation.members) s.compensation.members = {};
  // 有償枠からの移行1on1と、そのあとどこまで進んだか。
  // s.transition.members[氏名] = { group, status, note, updatedAt }
  if (!s.transition) s.transition = { members: {} };
  if (!s.transition.members) s.transition.members = {};
  (s.projects || []).forEach(p => {
    p.mentors = normalizeMemberList(p.mentors);
    p.students = normalizeMemberList(p.students);
  });
  return s;
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return ensureFields(JSON.parse(raw));
  } catch(e){}
  return ensureFields(JSON.parse(JSON.stringify(INITIAL)));
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  pushToSupabase();
}

// Supabase リアルタイム購読：他端末・他ユーザーの変更を即反映
function applyRemote(remote) {
  if (!remote) return;
  cloudLoaded = true; // クラウドの値を受け取れたので、以降の push を許可する
  if (JSON.stringify(remote) === JSON.stringify(state)) {
    setStatus("✅ 同期済み", "#2f7d4a");
    return;
  }
  state = ensureFields(remote);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  render();
  setStatus("✅ 同期済み", "#2f7d4a");
}

// 初回ロード：現在のクラウド側の値を取得
sb.from("org_state").select("data").eq("id", ROW_ID).maybeSingle()
  .then(({ data: row, error }) => {
    if (error) {
      // 読み込みが終わっていないので cloudLoaded は false のまま
      // （= それまでの編集は pushToSupabase で保存されず、上書き事故を防ぐ）
      setStatus("❌ 接続エラー（読み込み前のため編集は保存されません）: " + error.message, "#b73a4a");
      return;
    }
    if (!row) {
      // 初回：現在のローカル state をクラウドにアップロード（これは意図的な初回シードなので許可する）
      cloudLoaded = true;
      pushToSupabase();
      return;
    }
    applyRemote(row.data);
  });

// リアルタイム購読：以降の変更を即反映
sb.channel("org_state_changes")
  .on("postgres_changes", { event: "*", schema: "public", table: "org_state", filter: `id=eq.${ROW_ID}` }, payload => {
    applyRemote(payload.new && payload.new.data);
  })
  .subscribe(status => {
    if (status === "CHANNEL_ERROR") setStatus("❌ 接続エラー", "#b73a4a");
  });
function resetData() {
  inputDialog(
    "初期データに戻します。現在のデータは自動でバックアップされます。続行するには「初期化」と入力してください。",
    "",
    (v) => {
      if (v !== "初期化") { alert("入力が「初期化」と一致しなかったため中止しました。"); return; }
      exportJSON(); // 上書き前の自動バックアップ
      state = ensureFields(JSON.parse(JSON.stringify(INITIAL)));
      save(); render();
    }
  );
}
function exportJSON() {
  // member は応募者の氏名・メアドを閲覧できないロールなので、エクスポートJSONにも含めない。
  // state 自体は書き換えず、ディープコピー上でだけ該当フィールドを削除する。
  let data = state;
  if (!roleAtLeast("core")) {
    data = JSON.parse(JSON.stringify(state));
    ((data.recruitment && data.recruitment.rows) || []).forEach(row => {
      delete row.studentNames;
      delete row.studentEmails;
      delete row.owner;
      delete row.note;
    });
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rvss-org-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
}

// Google Sheetsへ手動バックアップ（1日1回の自動実行とは別に、いつでも押せる）
async function backupToSheets() {
  const btn = document.getElementById("sheets-backup-btn");
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "バックアップ中…";
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/sheets-backup`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "apikey": SUPABASE_ANON_KEY },
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    btn.textContent = "✅ バックアップ完了";
  } catch (e) {
    console.error(e);
    btn.textContent = "❌ 失敗（詳細はコンソール参照）";
  } finally {
    setTimeout(() => { btn.textContent = originalLabel; btn.disabled = false; }, 3000);
  }
}

// 募集フォームの回答シートを手動で取り込む（5時間おきの自動実行とは別に、いつでも押せる）
async function syncRecruitment() {
  const btn = document.getElementById("recruit-sync-btn");
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "取得中…";
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/sheets-recruitment-sync`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "apikey": SUPABASE_ANON_KEY },
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    // Edge Function が org_state を直接更新するため、最新のクラウド側の値を読み直す
    const { data: row, error } = await sb.from("org_state").select("data").eq("id", ROW_ID).maybeSingle();
    if (error) throw error;
    if (row) applyRemote(row.data);
    btn.textContent = `✅ ${data.rows}件を取得`;
  } catch (e) {
    console.error(e);
    btn.textContent = "❌ 失敗（詳細はコンソール参照）";
  } finally {
    setTimeout(() => { btn.textContent = originalLabel; btn.disabled = false; }, 3000);
  }
}

function allAssignedNames() {

// BSバッジ付きメンバー（学生ではないメンター等）はダッシュボード集計から除外する
function isBSMember(n) {
  return !!(memberInfo(n) || {}).isBS;
}

// プロジェクトに参加している学生名（重複なし）。
// 学生欄に載っていなくてもグループ内のメンバーは実際の参加者なので、枠のカウントに含める。
// 同じ人が複数グループに入っていても1名として数え、異体字（﨑/崎）のゆれも吸収する。
function projectStudentNames(p) {
  const byKey = new Map();
  const add = m => {
    const n = m && m.name;
    if (!n || isBSMember(n)) return;
    const key = n.replace(/﨑/g, "崎");
    if (!byKey.has(key)) byKey.set(key, n);
  };
  (p.students || []).forEach(add);
  (p.groups || []).forEach(g => (g.members || []).forEach(add));
  return Array.from(byKey.values());
}
function getStats() {
  const pjAssigned = new Set();
  state.projects.forEach(p => {
    (p.students||[]).forEach(m => { if (!isBSMember(m.name)) pjAssigned.add(m.name); });
    (p.groups||[]).forEach(g => (g.members||[]).forEach(m => { if (!isBSMember(m.name)) pjAssigned.add(m.name); }));
  });
  const communityNames = new Set();
  state.departments.forEach(d => {
    (d.lead||[]).forEach(m => { if (!isBSMember(m.name)) communityNames.add(m.name); });
    (d.groups||[]).forEach(g => {
      g.members.forEach(m => { if (!isBSMember(m.name)) communityNames.add(m.name); });
      (g.subGroups||[]).forEach(sg => sg.members.forEach(m => { if (!isBSMember(m.name)) communityNames.add(m.name); }));
    });
  });
  const allMembers = new Set(state.members.filter(n => !isDeleted(n)));
  Object.keys(MEMBER_INFO).forEach(n => {
    if (isDeleted(n)) return;
    const alt = n.replace(/﨑/g, "崎");
    const alt2 = n.replace(/崎/g, "﨑");
    if (!allMembers.has(n) && !allMembers.has(alt) && !allMembers.has(alt2)) {
      allMembers.add(n);
    }
  });
  const totalCount = Array.from(allMembers).filter(n => !isBSMember(n)).length;
  const paidCount = Array.from(allMembers).filter(n => !isBSMember(n) && isPaidMember(n)).length;
  return {
    projects: state.projects.length,
    pjAssign: pjAssigned.size,
    community: communityNames.size,
    paid: paidCount,
    total: totalCount,
  };
}

// ====== 有償枠 ======
// 大枠ごとに1枚のカード。所属先は他タブのデータ（部署・プロジェクト・スクール）から
// 自動で引いて表示するので、ここで二重に入力する必要はない。
function isPaidMember(name) {
  const keys = [name, name.replace(/﨑/g, "崎"), name.replace(/崎/g, "﨑")];
  return (state.paidGroups || []).some(g => (g.members || []).some(m => keys.includes(m.name)));
}

// 「人事/採用企画(統括)」→「人事」、「AI+(統括/川端さん直下)」→「AI+」のように大まかな名前だけ取る
function coarseAssignName(label) {
  return String(label).replace(/[（(][^（()）]*[)）]$/, "").split("/")[0].trim();
}
function concurrentTagsHTML(name) {
  const info = buildMemberMap()[name];
  if (!info) return "";
  const uniq = arr => Array.from(new Set(arr.map(coarseAssignName).filter(Boolean)));
  const tags = [];
  uniq(info.depts).forEach(d => tags.push(`<span class="tag">${escapeHtml(d)}</span>`));
  uniq(info.pjs).forEach(pj => tags.push(`<span class="tag pj">${escapeHtml(pj)}</span>`));
  uniq(info.schools).forEach(sc => tags.push(`<span class="tag" style="background:var(--purple);color:var(--purple-text)">${escapeHtml(sc)}スクール</span>`));
  return tags.length
    ? `<div class="concurrent">${tags.join("")}</div>`
    : `<div class="concurrent"><span class="tag" style="background:#f0eee7;color:#6b6b6b">所属なし</span></div>`;
}

function renderTransition() {

    return `<div class="sync-note">まだ対象者がいません。「+ 対象者を追加」から登録してください。</div>`;
  }
  // 既定の3グループを先に、後から足された独自グループをその後ろに並べる
  const extra = [...new Set(names.map(n => (all[n].group || "その他")))]

// ====== 報酬計算（管理者のみ） ======
// 2026年8月の実績一覧（48名）で検算し、西原さんの個別調整1件を除いて全員一致することを確認済み。
// 条件が変わったらこの定数だけを直せばよい。設定画面はまだ作らない。
const PAY_RULES = {
  base: 80000,
  minPayableHours: 40,            // これ未満は他の加算があっても支払なし
  hoursPenalties: [               // 上から順に判定し、最初に当てはまった額を使う
    { min: 60, amount: 0 },
    { min: 50, amount: -10000 },
    { min: 40, amount: -20000 },
  ],
  attendanceMin: 90,              // %。未満（未入力を含む）で減額
  attendancePenalty: -5000,
  scoreBands: [                   // 360°評価。上から順に判定
    { min: 3.5, amount: 75000 },
    { min: 3.0, amount: 25000 },
    { min: 2.5, amount: 5000 },
  ],
  schoolBonus: 5000,
  managerPay: 30000,
  // マネージャー認定は人が決める（条件が変わる運用のため自動判定にしない）。
  // 下記は「候補です」と表示するためだけの目安。
  managerHint: { minScore: 3.5, minHours: 60, requiresReferral: true },
};

function yen(n) {
  return (n < 0 ? "-" : "") + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
}
function payInfoOf(name) {
  const m = ((state.compensation || {}).members) || {};
  for (const k of [name, name.replace(/﨑/g, "崎"), name.replace(/崎/g, "﨑")]) if (m[k]) return m[k];
  return {};
}
// 「先月分」を対象にする。稼働時間（lastMonthHours）が先月のものなので表示もそれに揃える。
// ====== 対象月 ======
// 既定は先月分（確定）。当月はまだ終わっていないので、見たいときだけ「予想」に切り替える。
// 予想は Notion の「今月の稼働時間」を経過日数で割り戻した見込み稼働で計算する。
// 稼働時間以外（360°評価・出席率・リファ・スクール・マネージャー・手動調整）は確定分と同じ値を使う。
let payMode = "actual";
function payIsForecast() { return payMode === "forecast"; }
function setPayMode(m) { payMode = m; render(); }
function payMonthLabel() {
  const d = new Date();
  d.setDate(1);
  if (!payIsForecast()) d.setMonth(d.getMonth() - 1);
  return `${d.getFullYear()}年${d.getMonth() + 1}月`;
}
// 月末までの伸び率。9月24日なら 30÷24＝1.25 倍。
function payForecastFactor() {
  const now = new Date();
  const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  return days / Math.max(1, now.getDate());
}
// 対象月の稼働時間と、その内訳（プロジェクト別）。予想モードでは見込み値に引き伸ばす。
function payHoursBreakdown(name) {
  const mi = memberInfo(name) || {};
  if (!payIsForecast()) {
    return {
      hours: typeof mi.lastMonthHours === "number" ? mi.lastMonthHours : null,
      pjTotal: typeof mi.projectHoursTotal === "number" ? mi.projectHoursTotal : 0,
      buckets: mi.projectHours || {},
      actual: typeof mi.lastMonthHours === "number" ? mi.lastMonthHours : null,
    };
  }
  const cur = typeof mi.currentMonthHours === "number" ? mi.currentMonthHours : null;
  if (cur === null) return { hours: null, pjTotal: 0, buckets: {}, actual: null, floored: false };
  const f = payForecastFactor();
  const r1 = v => Math.round(v * f * 10) / 10;
  const buckets = {};
  Object.entries(mi.currentProjectHours || {}).forEach(([k, v]) => { buckets[k] = r1(v); });
  let hours = Math.round(cur * f * 2) / 2;
  // 9月は有償枠から無償枠への移行の途中で、稼働が一時的に落ちている人が多い。
  // その月だけ、支給ラインを割った人も一旦この時間として置く。
  // 10月以降は移行が固まってから決めるので、月を明示した例外にしてある。
  const floored = payMonthKey() === PAY_FORECAST_FLOOR.month && hours < PAY_FORECAST_FLOOR.hours;
  if (floored) hours = PAY_FORECAST_FLOOR.hours;
  return {
    hours,
    pjTotal: r1(typeof mi.currentProjectHoursTotal === "number" ? mi.currentProjectHoursTotal : 0),
    buckets,
    actual: cur,
    floored,
  };
}
const PAY_FORECAST_FLOOR = { month: "2026-09", hours: 40 };

// 最終金額を内訳付きで返す。内訳の合計がそのまま支給額になるようにしてある。
function computePay(name) {
  const pi = payInfoOf(name);
  const hours = payHoursBreakdown(name).hours;
  const lines = [];
  if (hours === null) return { payable: false, reason: "稼働時間が未取得", hours, lines, total: 0 };
  if (hours < PAY_RULES.minPayableHours) {
    return { payable: false, reason: `稼働${PAY_RULES.minPayableHours}時間未満（${hours}h）`, hours, lines, total: 0 };
  }
  lines.push({ label: "基本給", amount: PAY_RULES.base });

  const hp = PAY_RULES.hoursPenalties.find(p => hours >= p.min);
  if (hp && hp.amount) lines.push({ label: `稼働時間ペナルティ（${hours}h）`, amount: hp.amount });

  const att = typeof pi.attendanceRate === "number" ? pi.attendanceRate : null;
  if (att === null) lines.push({ label: "出席率ペナルティ（未入力）", amount: PAY_RULES.attendancePenalty });
  else if (att < PAY_RULES.attendanceMin) lines.push({ label: `出席率ペナルティ（${att}%）`, amount: PAY_RULES.attendancePenalty });

  const score = typeof pi.score360 === "number" ? pi.score360 : null;
  if (score !== null) {
    const band = PAY_RULES.scoreBands.find(b => score >= b.min);
    if (band) lines.push({ label: `360°評価加算（${score.toFixed(2)}）`, amount: band.amount });
  }
  if (pi.school) lines.push({ label: "スクール受講加算", amount: PAY_RULES.schoolBonus });
  if (pi.isManager) lines.push({ label: "マネージャー報酬", amount: PAY_RULES.managerPay });
  if (pi.adjust) lines.push({ label: "手動調整" + (pi.adjustNote ? `（${pi.adjustNote}）` : ""), amount: pi.adjust });

  return { payable: true, hours, lines, total: lines.reduce((s, l) => s + l.amount, 0) };
}

// 支払額をプロジェクトと組織運営に按分する。
// 各PJ按分 = 支払額 × そのPJの稼働 ÷ 総稼働。組織運営はその残り（端数がどこにも消えないように引き算で出す）。
function payAllocation(name, total) {
  const hb = payHoursBreakdown(name);
  const hours = typeof hb.hours === "number" ? hb.hours : 0;
  const pjTotal = hb.pjTotal;
  const buckets = hb.buckets;
  if (!hours || !total) return null;
  const rows = Object.entries(buckets)
    .sort((a, b) => b[1] - a[1])
    .map(([pj, h]) => ({ name: pj, hours: h, amount: Math.round(total * h / hours) }));
  const pjAmount = rows.reduce((s, r) => s + r.amount, 0);
  return {
    rows, pjAmount,
    orgHours: Math.round((hours - pjTotal) * 10) / 10,
    orgAmount: total - pjAmount,
    hours, pjTotal,
  };
}
function hasProjectWork(name) {
  const mi = memberInfo(name) || {};
  if (typeof mi.projectHoursTotal === "number") return mi.projectHoursTotal > 0;
  // Notion連携前のフォールバック：アプリ上のプロジェクト所属で判定する
  const info = buildMemberMap()[name];
  return !!(info && info.pjs.length > 0);
}

// 認定の判断材料。条件を満たしていても自動では付けない。
function managerEligible(name) {
  const pi = payInfoOf(name);
  const hours = payHoursBreakdown(name).hours; // 表示中の月に合わせる
  const h = PAY_RULES.managerHint;
  return typeof pi.score360 === "number" && pi.score360 >= h.minScore
    && (!h.requiresReferral || !!pi.referral)
    && typeof hours === "number" && hours >= h.minHours;
}

const openPayNames = new Set();
function togglePayDetail(name) {
  if (openPayNames.has(name)) openPayNames.delete(name);
  else openPayNames.add(name);
  const el = document.getElementById("content");
  if (el) el.innerHTML = renderCompensation();
}

function renderCompensation() {
  const map = buildMemberMap();
  const rows = Object.keys(map)
    .filter(n => !isBSMember(n))
    .map(n => ({ name: n, calc: computePay(n), pi: payInfoOf(n) }))
    .sort((a, b) => (b.calc.hours || 0) - (a.calc.hours || 0));
  const payable = rows.filter(r => r.calc.payable);
  const unpayable = rows.filter(r => !r.calc.payable);
  const total = payable.reduce((s, r) => s + r.calc.total, 0);
  const missingAttendance = payable.filter(r => typeof r.pi.attendanceRate !== "number").length;
  const missingScore = payable.filter(r => typeof r.pi.score360 !== "number").length;

  const cell = v => `<td>${v}</td>`;
  const row = r => {
    const pi = r.pi;
    const open = openPayNames.has(r.name);
    const hint = !pi.isManager && managerEligible(r.name)
      ? ` <span class="tag" style="background:var(--blue);color:var(--blue-text);font-size:10px">認定候補</span>` : "";
    const alloc = payAllocation(r.name, r.calc.total);
    const allocHTML = alloc && alloc.rows.length ? `
      <div class="pay-line" style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border);color:var(--muted);font-size:11px"><span>按分</span><span>稼働 ${alloc.hours}h</span></div>
      ${alloc.rows.map(a => `<div class="pay-line"><span>${escapeHtml(a.name)}（${a.hours}h）</span><span>${yen(a.amount)}</span></div>`).join("")}
      <div class="pay-line"><span>組織運営（${alloc.orgHours}h）</span><span>${yen(alloc.orgAmount)}</span></div>` : "";
    const detail = open ? `
      <tr class="pay-detail"><td colspan="10">
        ${r.calc.lines.map(l => `<div class="pay-line"><span>${escapeHtml(l.label)}</span><span>${yen(l.amount)}</span></div>`).join("")}
        <div class="pay-line total"><span>合計</span><span>${yen(r.calc.total)}</span></div>
        ${allocHTML}
      </td></tr>` : "";
    return `
      <tr class="pay-row" onclick="togglePayDetail(${jsArg(r.name)})">
        ${cell(`${open ? "▲" : "▼"} ${escapeHtml(r.name)}${hint}`)}
        ${cell(r.calc.hours != null ? r.calc.hours + "h" : "—")}
        ${cell(alloc && alloc.pjTotal > 0 ? alloc.pjTotal + "h" : "")}

        ${cell(typeof pi.score360 === "number" ? pi.score360.toFixed(2) : "—")}
        ${cell(pi.referral ? "有" : "")}
        ${cell(pi.school ? "○" : "")}
        ${cell(pi.isManager ? "○" : "")}
        ${cell(pi.adjust ? yen(pi.adjust) : "")}
        <td style="text-align:right;font-weight:700">${yen(r.calc.total)}
          <button class="btn editor-only" onclick="event.stopPropagation();editPayMember(${jsArg(r.name)})" style="font-size:10px;padding:2px 8px;margin-left:8px">編集</button>
        </td>
      </tr>${detail}`;
  };

  const unpaidRow = r => `
    <tr class="pay-row" style="color:var(--muted)">
      ${cell(escapeHtml(r.name))}
      ${cell(r.calc.hours != null ? r.calc.hours + "h" : "—")}
      <td colspan="7">${escapeHtml(r.calc.reason)}</td>
      <td style="text-align:right">${yen(0)}
        <button class="btn editor-only" onclick="editPayMember(${jsArg(r.name)})" style="font-size:10px;padding:2px 8px;margin-left:8px">編集</button>
      </td>
    </tr>`;

  // プロジェクトに関与している人とそうでない人でブロックを分ける（兼任は関与側に入る）
  const pjMembers = payable.filter(r => hasProjectWork(r.name));
  const orgMembers = payable.filter(r => !hasProjectWork(r.name));
  const sumOf = list => list.reduce((s, r) => s + r.calc.total, 0);
  const block = (title, list, rowFn) => !list.length ? "" : `
    <div class="card" style="margin-bottom:16px">
      <div class="card-head" style="margin-bottom:8px">
        <div class="card-title" style="font-size:14px">${title}（${list.length}名）</div>
        <div style="font-weight:700">${yen(sumOf(list))}</div>
      </div>
      <div style="overflow-x:auto">
        <table class="pay-table">
          <thead><tr>
            <th>氏名</th><th>稼働</th><th>PJ稼働</th><th>出席率</th><th>360°</th><th>リファ</th><th>スクール</th><th>Mgr</th><th>調整</th><th style="text-align:right">最終金額</th>
          </tr></thead>
          <tbody>${list.map(rowFn).join("")}</tbody>
        </table>
      </div>
    </div>`;

  const warn = [];
  if (missingScore) warn.push(`360°評価が未入力 ${missingScore}名`);
  if (missingAttendance) warn.push(`出席率が未入力 ${missingAttendance}名（各 ${yen(PAY_RULES.attendancePenalty)} として計算しています）`);

  return `
    <div class="card" style="margin-bottom:16px">
      <div class="card-head">
        <div class="card-title">${payMonthLabel()}分の報酬</div>
        <div style="font-size:20px;font-weight:700">${yen(total)}</div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">
        支給対象 ${payable.length}名 ／ 対象外 ${unpayable.length}名
      </div>
      ${warn.length ? `<div class="warn" style="margin-bottom:8px">${warn.map(escapeHtml).join("／")}</div>` : ""}
      ${payIsForecast() ? `<div class="warn" style="margin-bottom:8px">予想値です。${new Date().getMonth() + 1}月${new Date().getDate()}日時点の稼働を月末まで引き伸ばして（${payForecastFactor().toFixed(2)}倍）計算しています。稼働時間以外の項目と按分比率は確定分と同じ値を使っています。</div>` : ""}
      <div style="font-size:11px;color:var(--muted);line-height:1.8">

// ====== 報酬一覧のスプレッドシート書き出し ======
// 金額を扱うので、バックアップ用スプシ（リンクを知っていれば誰でも編集可）には書かない。
// 書き出し先は管理者が用意した非公開スプレッドシートを登録して使う。
// 計算はここ（クライアント側）で済ませて行データだけ送る。Edge Function 側に
// 計算ルールを二重に持たせると、片方だけ直したときに静かに食い違うため。
// ブックは月ごとに新規作成する。作ったIDは月をキーに覚えておき、同じ月に
// 何度押しても同じブックを上書きする（同じ月のファイルが増えないように）。
function payMonthKey() {
  const d = new Date();
  d.setDate(1);
  if (!payIsForecast()) d.setMonth(d.getMonth() - 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function payExportSheets() { return ((state.compensation || {}).exportSheets) || {}; }
function payExportSheetId() { return payExportSheets()[payMonthKey()] || ""; }
// 月ごとにブックを分けず、1冊に積み上げる。
// 以前の月別ブックが残っている場合は、最初にできた8月分のブックをそのまま引き継ぐ。
function payExportBookId() {
  const c = state.compensation || {};
  if (c.exportBookId) return c.exportBookId;
  const sheets = payExportSheets();
  const first = Object.keys(sheets).sort()[0];
  return first ? sheets[first] : "";
}
function payExportShareTo() { return ((state.compensation || {}).exportShareTo) || ""; }
function setPayExportShareTo() {
  inputDialog(
    "報酬ブックの共有先メールアドレス（複数ならカンマ区切り）",
    payExportShareTo(),
    v => {
      if (!state.compensation) state.compensation = { members: {} };
      state.compensation.exportShareTo = (v || "").trim();
      save(); render();
    }
  );
}
function payLineAmount(calc, prefix) {
  const l = calc.lines.find(x => x.label.startsWith(prefix));
  return l ? l.amount : 0;
}
// 書き出し上の担当者名。既存の報酬シートが「Haruya Sasaki (佐々木晴也)」形式なので、
// Notion連携で取れたタイトルがあればそれを使い、無ければ日本語名だけにする。
function payExportName(name) {
  return ((memberInfo(name) || {}).notionTitle) || name;
}
function payWorkNote(name) {
  return ((payInfoOf(name).workNotes) || {})[payMonthKey()] || "";
}
// 所属は「人事/育成(統括)」のような詳細ラベルを大枠に丸めて重複を除く
function payDeptLabel(name) {
  const info = buildMemberMap()[name];
  if (!info) return "";
  const all = [...(info.depts || []), ...(info.pjs || [])].map(coarseAssignName);
  return Array.from(new Set(all)).join("／");
}
function payEntries() {
  const map = buildMemberMap();
  return Object.keys(map).filter(n => !isBSMember(n))
    .map(n => ({ name: n, calc: computePay(n), pi: payInfoOf(n) }))
    .sort((a, b) => (b.calc.hours || 0) - (a.calc.hours || 0));
}

// 7月分の報酬シートと同じ3タブ構成で書き出す
function buildPaySheetRows() {
  const label = payMonthLabel();
  const rows = [[
    "担当者", "最終金額", "先月の稼働時間", "稼働時間ペナルティ", "土曜定例出席率", "出席率ペナルティ",
    "360°評価", "360°評価加算額", "スクール受講加算", "リファ有無", "マネージャー認定", "マネージャー報酬",
    "手動調整", "手動調整の理由", `${label}の業務内容`,
  ]];
  for (const e of payEntries()) {
    const c = e.calc, pi = e.pi;
    rows.push([
      payExportName(e.name),
      c.total,
      c.hours != null ? c.hours : "",
      payLineAmount(c, "稼働時間ペナルティ") || "",
      typeof pi.attendanceRate === "number" ? pi.attendanceRate / 100 : "",
      payLineAmount(c, "出席率ペナルティ") || "",
      typeof pi.score360 === "number" ? pi.score360 : "",
      payLineAmount(c, "360°評価加算") || "",
      payLineAmount(c, "スクール受講加算") || "",
      pi.referral ? "有" : "",
      pi.isManager ? "〇" : "",
      payLineAmount(c, "マネージャー報酬") || "",
      payLineAmount(c, "手動調整") || "",
      pi.adjustNote || "",
      payWorkNote(e.name),

// 按分タブ。プロジェクト列はNotionに存在するものから自動で決まるので、
// PJが増えてもここを直す必要はない。
function buildPayAllocationRows() {
  const label = payMonthLabel();
  const entries = payEntries().filter(e => e.calc.payable);
  const withPj = entries
    .map(e => ({ ...e, alloc: payAllocation(e.name, e.calc.total) }))
    .filter(e => e.alloc && e.alloc.rows.length > 0);
  const projects = Array.from(new Set(withPj.flatMap(e => e.alloc.rows.map(r => r.name)))).sort();
  const rows = [[
    "担当者", "支払額", "PJ按分", "組織運営按分", "プロジェクト稼働時間", "組織運営稼働時間", `${label}合計`,
    ...projects,
  ]];
  const total = [0, 0, 0, 0, 0, 0, ...projects.map(() => 0)];
  for (const e of withPj) {
    const a = e.alloc;
    const byPj = Object.fromEntries(a.rows.map(r => [r.name, r.hours]));
    const cells = [e.calc.total, a.pjAmount, a.orgAmount, a.pjTotal, a.orgHours, a.hours,
      ...projects.map(p => byPj[p] || 0)];
    cells.forEach((v, i) => { total[i] += Number(v) || 0; });
    rows.push([payExportName(e.name), ...cells]);
  }
  rows.push(["合計", ...total.map(v => Math.round(v * 10) / 10)]);
  return rows;
}

// ====== 月を積み上げた書き出し ======
// 1冊のブックに月ごとの区画を縦に積む。先頭が確定した先月分、その下が今月分の推定。
// 各区画の1行目は「2026年8月分給与」のような見出しで、その下がいつもの表。
function withPayMode(m, fn) {
  const prev = payMode;
  payMode = m;
  try { return fn(); } finally { payMode = prev; }
}
function paySectionTitle(mode) {
  return withPayMode(mode, () => `${payMonthLabel()}分給与${mode === "forecast" ? "の推定" : ""}`);
}
function stackPaySections(build) {
  const rows = [];
  ["actual", "forecast"].forEach((m, i) => {
    if (i > 0) { rows.push([]); rows.push([]); }
    rows.push([paySectionTitle(m)]);
    withPayMode(m, build).forEach(r => rows.push(r));
  });
  return rows;
}

function buildPayWorkRows() {
  const label = payMonthLabel();
  const rows = [["No", "氏名", "部署", "役割", `${label}の業務内容`]];
  payEntries().forEach((e, i) => {
    rows.push([i + 1, e.name, payDeptLabel(e.name), e.pi.role || "", payWorkNote(e.name)]);
  });
  return rows;
}
// Notion の DB_タスク から、その月に完了したタスクを担当者ごとに集めて業務内容欄へ入れる。
// 書き込みは Edge Function 側で org_state に直接行われ、購読経由でこちらへ返ってくる。
async function syncWorkNotesFromNotion() {
  confirmDialog(
    `${payMonthLabel()}の業務内容をNotionから取り直します。手で書いた内容は上書きされます。よろしいですか？`,
    runWorkNotesSync
  );
}
async function runWorkNotesSync() {
  const btn = document.getElementById("pay-notion-btn");
  const restore = () => { if (btn) { btn.disabled = false; btn.textContent = "Notionから業務内容を取得"; } };
  if (btn) { btn.disabled = true; btn.textContent = "取得中…"; }
  setStatus(`⏳ ${payMonthLabel()}分のタスクをNotionから取得中…`);
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/notion-worklog-sync`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ month: payMonthKey() }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    // 購読を取りこぼしても画面が古いままにならないよう、ここで読み直す
    const { data: row } = await sb.from("org_state").select("data").eq("id", ROW_ID).maybeSingle();
    if (row) applyRemote(row.data);
    const missed = data.unmatched || [];
    setStatus(
      `✅ ${data.matched}名分を取得しました` +
        (missed.length ? `（名前が一致せず取り込めず: ${missed.join("・")}）` : ""),
      missed.length ? "#b7862f" : "#2f7d4a"
    );
  } catch (e) {
    setStatus("❌ 取得失敗: " + e.message, "#b73a4a");
  } finally {
    restore();
  }
}
async function exportPayToSheets() {
  if (!payExportShareTo()) { setPayExportShareTo(); return; }
  const btn = document.getElementById("pay-export-btn");
  const restore = () => { if (btn) { btn.disabled = false; btn.textContent = "スプシで書き出す"; } };
  if (btn) { btn.disabled = true; btn.textContent = "書き出し中…"; }
  const existing = payExportBookId();
  setStatus(existing ? "⏳ 書き出し中…" : "⏳ ブックを作成中…");
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/sheets-pay-export`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({
        spreadsheetId: existing,
        bookTitle: "RVSS報酬一覧",
        shareWith: payExportShareTo().split(/[,、\s]+/).filter(Boolean),
        // 見出し行を挟むので、書式に使うヘッダーは2行目（0始まりで1）にある
        tabs: [
          { title: "報酬一覧", rows: stackPaySections(buildPaySheetRows), headerRowIndex: 1 },
          { title: "按分",     rows: stackPaySections(buildPayAllocationRows), headerRowIndex: 1 },
          { title: "業務内容", rows: stackPaySections(buildPayWorkRows), headerRowIndex: 1 },
        ],
      }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    if (data.url) window.open(data.url, "_blank", "noopener");
    if (data.created && data.spreadsheetId) {
      if (!state.compensation) state.compensation = { members: {} };
      state.compensation.exportBookId = data.spreadsheetId;
      save();
    }
    render();
    const tabs = (data.written || []).map(w => w.title).join("・");
    setStatus(
      `✅ ${data.created ? "新しいブックを作成しました" : "上書きしました"}（${tabs}）`,
      "#2f7d4a"
    );
  } catch (e) {
    setStatus("❌ 書き出し失敗: " + e.message, "#b73a4a");
  } finally {
    restore();
  }
}

// ====== プロジェクト募集状況 ======
// 学生募集フォーム（Googleフォーム）の回答シートを sheets-recruitment-sync が5時間おきに取り込み、
// state.recruitment に格納する。このタブはその読み取り専用ビュー。編集はシート側で行う運用。
const RECRUIT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1DcALjQGfuExjzCMC5BIQdQWu0g1wI_phovmTsWtka44/edit";

// カードの並び順。学生を募集している最中のもの（募集中・再募集中・応募待ち）を常に最上位に置く。
// 同じステータス内の並びはプロジェクトの登録順のまま。
const RECRUIT_STATUS_ORDER = [
  "募集中", "再募集中", "応募待ち",
  "応募あり", "PJ連携中", "アサイン確定",
  "辞退", "アサイン済み", "未募集",
];
const RECRUIT_STATUS_STYLE = {
  "未募集":       "background:#f0eee7;color:#6b6b6b",
  "募集中":       "background:var(--orange);color:var(--orange-text)",
  "応募待ち":     "background:var(--orange);color:var(--orange-text)",
  "応募あり":     "background:var(--green);color:var(--green-text)",
  "辞退":         "background:var(--pink);color:var(--pink-text)",
  "再募集中":     "background:var(--pink);color:var(--pink-text)",
  "PJ連携中":     "background:var(--blue);color:var(--blue-text)",
  "アサイン確定": "background:var(--purple);color:var(--purple-text)",
  "アサイン済み": "background:#2f7d4a;color:#fff",
};
const WEBTEST_STATUS_STYLE = {
  "発行依頼中": "background:var(--orange);color:var(--orange-text)",
  "実施中":     "background:var(--blue);color:var(--blue-text)",
  "実施済み":   "background:var(--green);color:var(--green-text)",
};

function recruitStatusStyle(s) { return RECRUIT_STATUS_STYLE[s] || "background:#f0eee7;color:#6b6b6b"; }
function recruitStatusTagHTML(s) {
  return `<span class="tag" style="${recruitStatusStyle(s)}">${escapeHtml(s)}</span>`;
}
// シート側の表記ゆれ（全角英数・全角プラス・空白）を吸収してアプリのプロジェクト名と突き合わせる
function normalizeProjectKey(name) {
  return String(name || "")
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/＋/g, "+").replace(/－/g, "-").replace(/’/g, "'")
    .replace(/[\s　]/g, "")
    .toUpperCase();
}

// プロジェクト単位で1枚のカードにまとめる。
// アプリ上のプロジェクト（＝枠情報）を基準に並べ、シートにしか無い事業名は後ろに続ける。
// 同じ事業名でフォーム回答が複数ある場合はタイムスタンプが最新のものを採用する
// （同期側で既に1件に絞られているが、古いデータが残っていても壊れないよう二重に判定する）。
// 表示するステータスは「アプリの上書きがあればそれ、無ければシート由来の値」。
function recruitOverrideOf(e) {
  return (state.recruitOverrides || {})[e.key] || null;
}
function resolveRecruitStatus(e) {
  const ov = recruitOverrideOf(e);
  if (ov && ov.recruitStatus) return ov.recruitStatus;
  return e.row ? e.row.recruitStatus : "未募集";
}
function resolveWebTestStatus(e) {
  const ov = recruitOverrideOf(e);
  if (ov && typeof ov.webTestStatus === "string") return ov.webTestStatus;
  return e.row ? e.row.webTestStatus : "";
}
function hasRecruitOverride(e) {
  const ov = recruitOverrideOf(e);
  return !!(ov && (ov.recruitStatus || typeof ov.webTestStatus === "string"));
}
function recruitOverrideAt(e) {
  const ov = recruitOverrideOf(e);
  if (!ov || !ov.updatedAt) return "";
  return new Date(ov.updatedAt).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function buildRecruitEntries() {
  const rows = (state.recruitment && state.recruitment.rows) || [];
  const ts = r => {
    const ms = Date.parse(r.timestamp || "");
    return isFinite(ms) ? ms : null;
  };
  const latestByKey = new Map();
  rows.forEach(r => {
    const key = normalizeProjectKey(r.project);
    const prev = latestByKey.get(key);
    if (!prev) { latestByKey.set(key, r); return; }
    const a = ts(prev), b = ts(r);
    let newer;
    if (a === null && b === null) newer = (r.rowNumber || 0) >= (prev.rowNumber || 0);
    else if (a === null) newer = true;
    else if (b === null) newer = false;
    else newer = b > a;
    if (newer) latestByKey.set(key, r);
  });

  // プロジェクト名で突き合わせるほか、recruitSourceKey（シート上の元の事業名）でも紐づける。
  // アプリ側で短い名前に付け替えているPJでも、シートの募集状況を正しく拾えるようにするため。
  const used = new Set();
  const entries = state.projects.map(p => {
    const nameKey = normalizeProjectKey(p.name);
    const srcKey = p.recruitSourceKey || "";
    used.add(nameKey);
    if (srcKey) used.add(srcKey);
    const row = latestByKey.get(nameKey) || (srcKey ? latestByKey.get(srcKey) : null);
    return { key: srcKey || nameKey, name: p.name, project: p, row: row || null };
  });
  latestByKey.forEach((r, key) => {
    if (!used.has(key)) entries.push({ key, name: r.project, project: null, row: r });
  });

  // 空きがある案件を左上から先に並べる。探しに来た人が最初に見るのは
  // ステータスではなく「入れる枠があるか」なので、枠の有無を第一の基準にする。
  // 枠が同じならステータス順。sort は安定なので、その中の並びは元のまま保たれる。
  const rank = e => {
    const i = RECRUIT_STATUS_ORDER.indexOf(resolveRecruitStatus(e));
    return i < 0 ? RECRUIT_STATUS_ORDER.length : i;
  };
  const openOf = e => {
    const o = recruitSlots(e).open;
    return typeof o === "number" ? o : -1; // アプリ未登録（枠が不明）は満員より後ろ
  };
  return entries.sort((a, b) => {
    const oa = openOf(a), ob = openOf(b);
    if ((oa > 0) !== (ob > 0)) return ob > 0 ? 1 : -1;
    return rank(a) - rank(b);
  });
}

let recruitView = "student";

// core 以上が募集の進捗ステータスを直接いじるための操作。
// シート側を更新しない運用になっているため、アプリの値を正とする。
function setRecruitOverrideField(key, field, value) {
  if (!key) return;
  if (!state.recruitOverrides) state.recruitOverrides = {};
  const cur = state.recruitOverrides[key] || {};
  state.recruitOverrides[key] = { ...cur, [field]: value, updatedAt: new Date().toISOString() };
  // render() でカードが並び替わるとページが一番上に飛ぶことがあるので、
  // スクロール位置を保存して復元する
  const y = window.scrollY;
  save(); render();
  window.scrollTo(0, y);
}
function setRecruitStatus(key, value) { setRecruitOverrideField(key, "recruitStatus", value); }
function setRecruitWebTest(key, value) { setRecruitOverrideField(key, "webTestStatus", value); }
function clearRecruitOverride(key) {
  if (!key || !state.recruitOverrides) return;
  delete state.recruitOverrides[key];
  // こちらも同様に、再描画によるスクロール位置ジャンプを防ぐ
  const y = window.scrollY;
  save(); render();
  window.scrollTo(0, y);
}

function renderRecruit() {
  const entries = buildRecruitEntries();
  const synced = state.recruitment && state.recruitment.syncedAt;
  const syncedLabel = synced
    ? new Date(synced).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
    : "未取得";

  // 全メンバー向けには募集枠だけを見せる。進捗の切り替えは core 以上にしか作らない。
  const showToggle = roleAtLeast("core");
  const view = showToggle ? recruitView : "student";
  const views = [
    { id: "student",  label: "募集枠で見る" },
    { id: "progress", label: "進捗で見る" },
  ];
  const toggle = !showToggle ? "" : views.map(v => {
    const active = view === v.id;
    const style = `background:${active?'#2a2a2a':'#fff'};color:${active?'#fff':'#6b6b6b'};border:1px solid ${active?'#2a2a2a':'#e5e3dc'};font-size:13px;padding:6px 14px;cursor:pointer;${active?'font-weight:700':''}`;
    return `<span class="tag" style="${style}" onclick="onRecruitViewChange('${v.id}')">${v.label}</span>`;

// カード共通：アプリ上のプロジェクトから枠の情報を取り出す
function slotNameKey(n) { return String(n || "").replace(/[\s　]/g, "").replace(/﨑/g, "崎"); }

// シートの「学生の名前」に名前が入った時点で、その人数分だけ枠が埋まる。
// ステータスもアサイン管理表側の在籍も見ない。シートに書かれた事実だけを数える
// （アサインが確定した人の名前もここに入る運用のため、在籍済みを除くと枠が減らない）。
function recruitTakenNames(e) {
  const names = (e.row && e.row.studentNames) || [];
  const seen = new Set();
  return names.filter(n => {
    const k = slotNameKey(n);
    if (!k || seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
// 空き枠はスプシの「募集人数」列がすべて。アサイン管理表の人数からは計算しない。
// 既存PJは「いま何人募集しているか」を都度フォームで起票する運用で、
// 定員からアサイン済みを引く出し方は実態と合わないため。
// 募集人数の記載がなければ「募集なし」として扱う（推測で枠を作らない）。
function recruitSlots(e) {
  const wanted = e && e.row ? e.row.capacity : null;
  if (typeof wanted !== "number" || wanted <= 0) return { wanted: null, taken: 0, open: null };
  const taken = recruitTakenNames(e).length;
  return { wanted, taken, open: Math.max(0, wanted - taken) };
}
function recruitMentor(e) {
  return (e.row && e.row.mentor)
    || (e.project && (e.project.mentors || []).length ? e.project.mentors.map(m => m.name).join("、") : "");
}

// 案3：空き枠を主役にしたカード（学生向け）
function renderRecruitCardStudent(e) {
  const r = e.row;
  const status = resolveRecruitStatus(e);
  const { wanted, open, taken } = recruitSlots(e);
  // 枠が空いていれば色をつける。募集ステータスがどうであれ、入れる枠があるかが先。
  const hasRoom = open > 0;
  const recruiting = hasRoom && RECRUITING_STATUSES.includes(status);
  // 誰の名前が入っているかは core 以上にしか出さないが、人数だけは枠の説明として出す
  const pendingNote = taken > 0
    ? `<div style="font-size:11px;color:var(--muted);margin-top:4px">${taken}名分が埋まっています（募集${wanted}枠）</div>`
    : "";

  else if (open > 0)   { num = open; unit = recruiting ? "枠 募集中" : "枠 空き"; color = "var(--orange-text)"; }
  else                 { num = 0;    unit = "枠 満員";     color = "var(--muted)"; }

// 案2：募集からアサインまでの進捗トラック付きカード（アサイン担当向け）
const RECRUIT_STEPS = ["募集中", "応募あり", "連携中", "確定", "アサイン済"];
// 未募集・辞退はトラック上の位置を持たないため -1 を返し、代わりにステータスを1行で出す
function recruitStepIndex(status) {
  if (RECRUITING_STATUSES.includes(status)) return 0;
  if (status === "応募あり") return 1;
  if (status === "PJ連携中") return 2;
  if (status === "アサイン確定") return 3;
  if (status === "アサイン済み") return 4;
  return -1;
}

// ====== 長押しドラッグでの並び替え ======
function reorderData(ref, idx) {
  const key = [ref.type, ref.pi, ref.gi, ref.sgi, ref.di, ref.path ? ref.path.join(".") : null]
    .filter(v => v !== undefined && v !== null).join(":");
  return `data-reorder='${JSON.stringify(ref)}' data-reorder-idx="${idx}" data-reorder-key="${key}"`;
}
function getReorderableArray(ref) {
  switch (ref.type) {
    case "projectMentors": return state.projects[ref.pi].mentors;
    case "projectStudents": return state.projects[ref.pi].students;
    case "projectGroupMembers": return state.projects[ref.pi].groups[ref.gi].members;
    case "paidGroupMembers": return state.paidGroups[ref.gi].members;
    case "deptLead": return state.departments[ref.di].lead;
    case "deptGroupMembers": return state.departments[ref.di].groups[ref.gi].members;
    case "deptSubGroupMembers": return state.departments[ref.di].groups[ref.gi].subGroups[ref.sgi].members;
    default: return null;
  }
}
function reorderItem(ref, fromIndex, toIndex) {
  const arr = getReorderableArray(ref);
  if (!arr || fromIndex === toIndex || fromIndex == null || toIndex == null) { render(); return; }
  const [item] = arr.splice(fromIndex, 1);
  arr.splice(toIndex, 0, item);
  save(); render();
}

(function setupReorderDrag() {
  const LONG_PRESS_MS = 350;
  const MOVE_CANCEL_PX = 8;
  let pressTimer = null;
  let startX = 0, startY = 0;

  function cleanupPress() {
    clearTimeout(pressTimer);
    document.removeEventListener("pointermove", onPreDragMove);
    document.removeEventListener("pointerup", onPreDragUp);
  }
  function onPreDragMove(e) {
    if (Math.abs(e.clientX - startX) > MOVE_CANCEL_PX || Math.abs(e.clientY - startY) > MOVE_CANCEL_PX) cleanupPress();
  }
  function onPreDragUp() { cleanupPress(); }

  document.addEventListener("pointerdown", (e) => {
    if (typeof isEditMode !== "undefined" && !isEditMode) return;
    if (e.target.closest("button, .tag, input, textarea, select")) return;
    const slotEl = e.target.closest(".slot[data-reorder-key]");
    if (!slotEl) return;
    startX = e.clientX; startY = e.clientY;
    document.addEventListener("pointermove", onPreDragMove);
    document.addEventListener("pointerup", onPreDragUp, { once: true });
    pressTimer = setTimeout(() => {
      cleanupPress();
      beginReorderDrag(slotEl, e);
    }, LONG_PRESS_MS);
  });

  function beginReorderDrag(slotEl, e) {
    slotEl.classList.add("dragging");
    document.body.style.userSelect = "none";
    try { slotEl.setPointerCapture(e.pointerId); } catch (err) {}
    const key = slotEl.dataset.reorderKey;

    const nameText = (slotEl.querySelector(".name")?.textContent || "").trim();
    const ghost = document.createElement("div");
    ghost.className = "reorder-ghost";
    ghost.textContent = nameText;
    document.body.appendChild(ghost);
    const positionGhost = (x, y) => {
      ghost.style.left = x + "px";
      ghost.style.top = (y - 36) + "px";
    };
    positionGhost(e.clientX, e.clientY);

    const onMove = (ev) => {
      positionGhost(ev.clientX, ev.clientY);
      const siblings = Array.from(document.querySelectorAll(`.slot[data-reorder-key="${key}"]`)).filter(el => el !== slotEl);
      let after = null, closestOffset = -Infinity;
      siblings.forEach(sib => {
        const box = sib.getBoundingClientRect();
        const offset = ev.clientY - box.top - box.height / 2;
        if (offset < 0 && offset > closestOffset) { closestOffset = offset; after = sib; }
      });
      const parent = slotEl.parentElement;
      if (after) parent.insertBefore(slotEl, after);
      else parent.appendChild(slotEl);
    };
    const onUp = () => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      slotEl.classList.remove("dragging");
      document.body.style.userSelect = "";
      ghost.remove();
      const ref = JSON.parse(slotEl.dataset.reorder);
      const fromIndex = parseInt(slotEl.dataset.reorderIdx, 10);
      const toIndex = Array.from(document.querySelectorAll(`.slot[data-reorder-key="${key}"]`)).indexOf(slotEl);
      reorderItem(ref, fromIndex, toIndex);
    };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp, { once: true });
  }
})();

}

// 全メンバーごとに「プロジェクト/コミュニティ運営/スクール」を集計したマップを返す
function buildMemberMap() {
  const map = {};
  const ensure = (n) => { if(!map[n]) map[n]={pjs:[],depts:[],schools:[]}; if(!map[n].schools) map[n].schools=[]; return map[n]; };
  state.members.forEach(n => { if (!isDeleted(n)) ensure(n); });
  // Google Sheets由来のメンバーも追加（未登録分・未削除分）
  Object.keys(MEMBER_INFO).forEach(n => {
    if (isDeleted(n)) return;
    const alt = n.replace(/﨑/g, "崎");
    const alt2 = n.replace(/崎/g, "﨑");
    if (!map[n] && !map[alt] && !map[alt2]) ensure(n);
  });
  state.projects.forEach(p => {
    p.students.forEach(m => { ensure(m.name).pjs.push(p.name+(m.role?"("+m.role+")":"")); });
    (p.groups||[]).forEach(g => g.members.forEach(m => { ensure(m.name).pjs.push(p.name+"/"+g.name+(m.role?"("+m.role+")":"")); }));
  });
  state.departments.forEach(d => {
    (d.lead||[]).forEach(m => { ensure(m.name).depts.push(d.name+"/"+m.role); });
    (d.groups||[]).forEach(g => {
      g.members.forEach(m => { ensure(m.name).depts.push(d.name+"/"+g.name+(m.role?"("+m.role+")":"")); });
      (g.subGroups||[]).forEach(sg => sg.members.forEach(m => { ensure(m.name).depts.push(d.name+"/"+g.name+"/"+sg.name+(m.role?"("+m.role+")":"")); }));
    });
  });
  (state.schools||[]).forEach(s => {
    const add = (n, role) => { ensure(n).schools.push(s.name+"/"+role); };
    if (s.tl) add(s.tl, "TL");
    if (s.subTl) add(s.subTl, "副TL");
    s.students.forEach(n => add(n, "受講"));
  });
  return map;
}

function renderAll() {
  const q = allFilterSearch.trim();
  const map = buildMemberMap();

  // エリア集計
  const areaCounts = {};
  Object.keys(map).forEach(n => {
    const mi = memberInfo(n);
    if (mi && mi.area) areaCounts[mi.area] = (areaCounts[mi.area]||0) + 1;
  });
  const areaSummary = AREA_LIST.filter(a => areaCounts[a]).map(a => {
    const c = AREA_COLORS[a];
    const active = allFilterArea === a;
    const style = `background:${c.bg};color:${c.fg};font-size:13px;padding:6px 14px;cursor:pointer;${active?'outline:2px solid '+c.fg+';outline-offset:1px;font-weight:700':''}`;
    return `<span class="tag" style="${style}" onclick="onAllAreaChange('${active?'':a}')">${a} ${areaCounts[a]}</span>`;
  }).join(" ");
  const clearChip = allFilterArea
    ? ` <span class="tag" style="background:#fff;color:#6b6b6b;border:1px solid #e5e3dc;font-size:12px;padding:6px 12px;cursor:pointer" onclick="onAllAreaChange('')">エリア絞り込みを解除</span>`
    : "";

  // アサイン状況フィルター
  const assignDefs = [
    { id: "hasPj",        label: "プロジェクト所属", test: (i, n) => i.pjs.length > 0 },
    { id: "hasCommunity", label: "コミュニティ運営", test: (i, n) => i.depts.length > 0 },
    { id: "isPaid",       label: "有償枠",           test: (i, n) => isPaidMember(n) },
    // 無償枠はバッジを付けない運用なので、有償枠バッジが無い＝無償枠として扱う（BSメンバーは枠の対象外）
    { id: "isUnpaid",     label: "無償枠",           test: (i, n) => !isPaidMember(n) && !isBSMember(n) },
  ];
  // アサイン状況・契約状況は運営側の情報なので、全メンバービューでは出さない
  // （カードからも消しているため、絞り込みだけ残っていると辻褄が合わない）
  const assignDef = roleAtLeast("core") ? assignDefs.find(d => d.id === allFilterAssign) : null;
  const assignSummary = !roleAtLeast("core") ? "" : assignDefs.map(d => {
    const count = Object.entries(map).filter(([n, i]) => d.test(i, n)).length;
    const active = allFilterAssign === d.id;
    const style = `background:${active?'#2a2a2a':'#fff'};color:${active?'#fff':'#6b6b6b'};border:1px solid ${active?'#2a2a2a':'#e5e3dc'};font-size:13px;padding:6px 14px;cursor:pointer;${active?'font-weight:700':''}`;
    return `<span class="tag" style="${style}" onclick="onAllAssignChange('${d.id}')">${d.label} ${count}</span>`;
  }).join(" ");

  // スキルフィルター（大分類チップのみ表示）。各メンバーに手動で分類済みの
  // memberInfo.skillCategories があればそれを優先し、なければカテゴリ内のいずれかの
  // キーワードが memberInfo.skills の自由記述に含まれるかで判定する（フォールバック）。
  const hasSkillCategory = (n, categoryName) => {
    const cat = SKILL_CATEGORIES.find(c => c.name === categoryName);
    const mi = memberInfo(n);
    if (!cat || !mi) return false;
    if (mi.skillCategories) return mi.skillCategories.includes(categoryName);
    if (!mi.skills) return false;
    return cat.keywords.some(k => mi.skills.includes(k));
  };
  const skillCounts = {};
  Object.keys(map).forEach(n => {
    SKILL_CATEGORIES.forEach(c => { if (hasSkillCategory(n, c.name)) skillCounts[c.name] = (skillCounts[c.name]||0) + 1; });
  });
  const skillSummary = SKILL_CATEGORIES.map(c => {
    const active = allFilterSkill === c.name;
    const count = skillCounts[c.name] || 0;
    const style = `background:${active?'#2a2a2a':'#fff'};color:${active?'#fff':'#6b6b6b'};border:1px solid ${active?'#2a2a2a':'#e5e3dc'};font-size:13px;padding:6px 14px;cursor:pointer;${active?'font-weight:700':''}`;
    return `<span class="tag" style="${style}" onclick="onAllSkillChange('${c.name}')" title="${escapeHtml(c.keywords.join('・'))}">${c.name} ${count}</span>`;
  }).join(" ");

  // 契約状況フィルター（NDA・業務委託契約は独立管理なので、それぞれ未締結/締結済みを独立したチップにする）
  // BSメンバーはそもそも契約の対象外なので、件数にも絞り込み結果にも含めない
  const CONTRACT_FILTERS = [
    { id: "ndaNone",        label: "NDA未締結",         test: mi => !mi.ndaSigned },
    { id: "ndaDone",        label: "NDA締結完了",       test: mi => !!mi.ndaSigned },
    { id: "contractNone",   label: "業務委託契約未締結", test: mi => !mi.outsourcingSigned },
    { id: "contractDone",   label: "業務委託契約締結済み", test: mi => !!mi.outsourcingSigned },
  ];
  const contractSummary = !roleAtLeast("core") ? "" : CONTRACT_FILTERS.map(f => {
    const active = allFilterContract === f.id;
    const count = Object.keys(map).filter(n => !isBSMember(n) && f.test(memberInfo(n) || {})).length;
    const style = `background:${active?'#2a2a2a':'#fff'};color:${active?'#fff':'#6b6b6b'};border:1px solid ${active?'#2a2a2a':'#e5e3dc'};font-size:13px;padding:6px 14px;cursor:pointer;${active?'font-weight:700':''}`;
    return `<span class="tag" style="${style}" onclick="onAllContractChange('${f.id}')">${f.label} ${count}</span>`;
  }).join(" ");

  // 残り活動期間フィルター（core 以上のみ。引き継ぎ計画で「もうすぐ抜ける人」を拾うため）
  const TENURE_FILTERS = [
    { id: "leaving", label: "卒業予定", test: mi => mi.tenureIntent === "卒業" },
    { id: "staying", label: "継続予定", test: mi => mi.tenureIntent === "継続" },
    { id: "soon", label: `${GRADUATION_SOON_MONTHS}ヶ月以内`, test: mi => { const l = monthsUntilYM(mi.availableUntil); return l !== null && l <= GRADUATION_SOON_MONTHS; } },
    { id: "handover", label: "引き継ぎ要", test: mi => !!mi.handoverNeeded },
    { id: "unset", label: "意思未確認", test: mi => !mi.tenureIntent },
  ];
  const REFERRAL_FILTERS = [
    { id: "refDone", label: "リファ成立", test: n => referralStatus(n).established },
    { id: "refSome", label: "紹介あり", test: n => referralStatus(n).list.length > 0 },
    { id: "refFrom", label: "紹介で入会", test: n => !!(memberInfo(n) || {}).referredBy },
  ];
  const referralSummary = !roleAtLeast("core") ? "" : REFERRAL_FILTERS.map(f => {
    const active = allFilterReferral === f.id;
    const count = Object.keys(map).filter(n => !isBSMember(n) && f.test(n)).length;
    const style = `background:${active?'#2a2a2a':'#fff'};color:${active?'#fff':'#6b6b6b'};border:1px solid ${active?'#2a2a2a':'#e5e3dc'};font-size:13px;padding:6px 14px;cursor:pointer;${active?'font-weight:700':''}`;
    return `<span class="tag" style="${style}" onclick="onAllReferralChange('${f.id}')">${f.label} ${count}</span>`;
  }).join(" ");
  const tenureSummary = !roleAtLeast("core") ? "" : TENURE_FILTERS.map(f => {
    const active = allFilterTenure === f.id;
    const count = Object.keys(map).filter(n => !isBSMember(n) && f.test(memberInfo(n) || {})).length;
    const style = `background:${active?'#2a2a2a':'#fff'};color:${active?'#fff':'#6b6b6b'};border:1px solid ${active?'#2a2a2a':'#e5e3dc'};font-size:13px;padding:6px 14px;cursor:pointer;${active?'font-weight:700':''}`;
    return `<span class="tag" style="${style}" onclick="onAllTenureChange('${f.id}')">${f.label} ${count}</span>`;
  }).join(" ");

  const filtered = Object.entries(map)
    .filter(([n]) => {
      if (!q) return true;
      if (n.includes(q)) return true;
      const mi = memberInfo(n) || {};
      return [mi.experience, mi.skills, mi.wantToDo].some(v => v && v.includes(q));
    })
    .filter(([n]) => {
      if (!allFilterArea) return true;
      const mi = memberInfo(n);
      return mi && mi.area === allFilterArea;
    })
    .filter(([n, info]) => !assignDef || assignDef.test(info, n))
    .filter(([n]) => !allFilterSkill || hasSkillCategory(n, allFilterSkill))
    .filter(([n]) => {
      if (!allFilterContract || !roleAtLeast("core")) return true;
      if (isBSMember(n)) return false;
      const f = CONTRACT_FILTERS.find(f => f.id === allFilterContract);
      return !f || f.test(memberInfo(n) || {});
    })
    .filter(([n]) => {
      if (!allFilterTenure || !roleAtLeast("core")) return true;
      if (isBSMember(n)) return false;
      const f = TENURE_FILTERS.find(f => f.id === allFilterTenure);
      return !f || f.test(memberInfo(n) || {});
    })
    .filter(([n]) => {
      if (!allFilterReferral || !roleAtLeast("core")) return true;
      if (isBSMember(n)) return false;
      const f = REFERRAL_FILTERS.find(f => f.id === allFilterReferral);
      return !f || f.test(n);
    })
    // 有償枠を常に上部に。エリアで絞り込んだときも同じ並びになる
    .sort(([a],[b]) => (isPaidMember(b) ? 1 : 0) - (isPaidMember(a) ? 1 : 0) || a.localeCompare(b,"ja"));

  // BSメンバー（学生メンバーではないため別枠にする。件数表示からも除く）
  const isBSName = (n) => !!(memberInfo(n) || {}).isBS;
  const regularFiltered = filtered.filter(([n]) => !isBSName(n));
  const bsFiltered = filtered.filter(([n]) => isBSName(n));
  const totalRegular = Object.keys(map).filter(n => !isBSName(n)).length;

  // 有償枠／無償枠で見出しを分けて表示する（片方しか居ないときは見出しを出さない）
  const paidRows = regularFiltered.filter(([n]) => isPaidMember(n));
  const unpaidRows = regularFiltered.filter(([n]) => !isPaidMember(n));
  const cardsOf = rows => rows.map(([n,info]) => renderMemberCard(n, info)).join("");
  const sectionHead = (label, count, color) =>
    `<div style="display:flex;align-items:center;gap:8px;margin:4px 0 10px">
      <span class="tag" style="background:${color.bg};color:${color.fg};font-size:12px">${label}</span>
      <span style="font-size:12px;color:var(--muted)">${count}名</span>
      <span style="flex:1;height:1px;background:var(--border)"></span>
    </div>`;
  const cards = (roleAtLeast("core") && paidRows.length && unpaidRows.length)
    ? `${sectionHead("有償枠", paidRows.length, { bg: "var(--green)", fg: "var(--green-text)" })}
       <div class="grid">${cardsOf(paidRows)}</div>
       <div style="margin-top:20px">${sectionHead("無償枠", unpaidRows.length, { bg: "#f0eee7", fg: "#6b6b6b" })}</div>
       <div class="grid">${cardsOf(unpaidRows)}</div>`
    : (regularFiltered.length ? `<div class="grid">${cardsOf(regularFiltered)}</div>` : "");
  const bsSection = bsFiltered.length > 0 ? `
    <div style="margin-top:24px;padding-top:16px;border-top:1px dashed var(--border)">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">BSメンバー（${bsFiltered.length}名）</div>
      <div class="grid">${bsFiltered.map(([n,info]) => renderMemberCard(n, info)).join("")}</div>
    </div>
  ` : "";

  // 削除済みメンバー（復元可能）
  const deletedList = (state.deletedMembers || []);
  const deletedSection = deletedList.length > 0 ? `
    <div style="margin-top:24px;padding-top:16px;border-top:1px dashed var(--border)">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">退会者（${deletedList.length}名・クリックで復元）</div>
      <div class="unassigned-list">
        ${deletedList.map(n => `<span class="chip editor-only" style="background:#f0eee7;color:var(--muted);cursor:pointer" onclick="restoreMember('${n}')" title="復元">↻ ${escapeHtml(n)}</span>`).join("")}
      </div>
    </div>
  ` : "";

  const contractFilterDef = CONTRACT_FILTERS.find(f => f.id === allFilterContract);
  const tenureFilterDef = roleAtLeast("core") ? TENURE_FILTERS.find(f => f.id === allFilterTenure) : null;
  const filterNote = [allFilterArea, assignDef && assignDef.label, allFilterSkill, contractFilterDef && contractFilterDef.label, tenureFilterDef && tenureFilterDef.label].filter(Boolean).join(" / ");
  const titleText = filterNote
    ? `全メンバー（${regularFiltered.length} / 総${totalRegular}名） — ${filterNote}`
    : `全メンバー（${totalRegular}名）`;
  return `
    <div class="card" style="margin-bottom:16px">
      <div class="card-head"><div class="card-title">${escapeHtml(titleText)}</div></div>
      <div style="margin-bottom:10px;line-height:2">
        <span style="font-size:12px;color:var(--muted);margin-right:6px">エリア:</span>${areaSummary || '<span style="font-size:12px;color:var(--muted)">なし</span>'}${clearChip}
      </div>
      ${assignSummary ? `<div style="margin-bottom:10px;line-height:2">
        <span style="font-size:12px;color:var(--muted);margin-right:6px">アサイン状況:</span>${assignSummary}
        ${allFilterAssign ? ` <span class="tag" style="background:#fff;color:#6b6b6b;border:1px solid #e5e3dc;font-size:12px;padding:6px 12px;cursor:pointer" onclick="onAllAssignChange('${allFilterAssign}')">絞り込みを解除</span>` : ""}
      </div>` : ""}
      <div style="margin-bottom:10px;line-height:2">
        <span style="font-size:12px;color:var(--muted);margin-right:6px">スキル:</span>${skillSummary}
        ${allFilterSkill ? ` <span class="tag" style="background:#fff;color:#6b6b6b;border:1px solid #e5e3dc;font-size:12px;padding:6px 12px;cursor:pointer" onclick="onAllSkillChange('${allFilterSkill}')">絞り込みを解除</span>` : ""}
      </div>
      ${contractSummary ? `<div style="margin-bottom:${tenureSummary ? "10px" : "0"};line-height:2">
        <span style="font-size:12px;color:var(--muted);margin-right:6px">契約状況:</span>${contractSummary}
        ${allFilterContract ? ` <span class="tag" style="background:#fff;color:#6b6b6b;border:1px solid #e5e3dc;font-size:12px;padding:6px 12px;cursor:pointer" onclick="onAllContractChange('${allFilterContract}')">絞り込みを解除</span>` : ""}
      </div>` : ""}
      ${tenureSummary ? `<div style="margin-bottom:10px;line-height:2">
        <span style="font-size:12px;color:var(--muted);margin-right:6px">残り活動期間:</span>${tenureSummary}
        ${allFilterTenure ? ` <span class="tag" style="background:#fff;color:#6b6b6b;border:1px solid #e5e3dc;font-size:12px;padding:6px 12px;cursor:pointer" onclick="onAllTenureChange('${allFilterTenure}')">絞り込みを解除</span>` : ""}
      </div>` : ""}
      ${referralSummary ? `<div style="margin-bottom:0;line-height:2">
        <span style="font-size:12px;color:var(--muted);margin-right:6px">リファラル:</span>${referralSummary}
        ${allFilterReferral ? ` <span class="tag" style="background:#fff;color:#6b6b6b;border:1px solid #e5e3dc;font-size:12px;padding:6px 12px;cursor:pointer" onclick="onAllReferralChange('${allFilterReferral}')">絞り込みを解除</span>` : ""}
      </div>` : ""}
    </div>
    ${cards || '<div class="warn">該当メンバーがいません</div>'}
    ${bsSection}
    ${deletedSection}
  `;
}

function renderMemberCard(n, info) {
  const mi = memberInfo(n) || {};
  const profileField = (label, value) => `
    <div class="section-label">${escapeHtml(label)}</div>
    <div style="font-size:13px;line-height:1.6;white-space:pre-wrap;margin-bottom:10px;color:${value ? "var(--text)" : "var(--muted)"}">${value ? escapeHtml(value) : "未設定"}</div>
  `;
  // 全メンバー向けビューでは、契約・所属・稼働といった運営側の情報は出さず、
  // Canvaの自己紹介に当たる項目だけを見せる。CSSで隠すのではなくHTMLを作らない。
  const showAdmin = roleAtLeast("core");
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-title">${escapeHtml(n)}${showAdmin && mi.isBS ? ` <span class="tag" style="background:#2a2a2a;color:#fff;font-size:11px;vertical-align:middle">BS</span>` : ""}${showAdmin && isPaidMember(n) ? ` <span class="tag" style="background:var(--green);color:var(--green-text);font-size:11px;vertical-align:middle">有償</span>` : ""}${mi.status ? ` <span class="tag" style="background:var(--pink);color:var(--pink-text);font-size:11px;vertical-align:middle">${escapeHtml(mi.status)}</span>` : ""}</div>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="btn editor-only" onclick="editMember('${n}')" style="font-size:11px;padding:4px 10px">編集</button>
          <button class="btn editor-only" onclick="deleteMember('${n}')" title="退会扱いにする（全アサインから除外）" style="font-size:11px;padding:4px 10px;color:var(--pink-text)">退会</button>
        </div>
      </div>
      ${showAdmin && !mi.isBS ? `<div style="margin-bottom:10px">
        ${ndaStatusTagHTML(n, mi)}
        ${outsourcingStatusTagHTML(n, mi.outsourcingSigned)}
      </div>` : ""}
      <div style="line-height:1.8;margin-bottom:12px">
        ${mi.university ? univTagHTML(mi.university) : ""}
        ${mi.area ? areaTagHTML(mi.area) : ""}
        ${showAdmin ? `
          ${referralHTML(n, mi)}
          ${info.pjs.map(p=>`<span class="tag pj">${escapeHtml(p)}</span>`).join(" ")}
          ${info.depts.map(d=>`<span class="tag">${escapeHtml(d)}</span>`).join(" ")}
          ${(info.schools||[]).map(s=>`<span class="tag" style="background:var(--purple);color:var(--purple-text)">スクール:${escapeHtml(s)}</span>`).join(" ")}
        ` : ""}
      </div>
      ${showAdmin ? contractRemainingHTML(mi) : ""}
      ${showAdmin ? workloadHTML(mi.lastMonthHours) : ""}
      ${profileField("趣味", mi.hobby)}
      ${profileField("経験", mi.experience)}
      ${profileField("スキル", mi.skills)}
      ${profileField("やりたいこと", mi.wantToDo)}
      ${profileField("尊敬する人", mi.admires)}
    </div>
  `;
}

// ====== 操作 ======
// iframe や厳格なブラウザで prompt が動かない環境向けの代替
function inputDialog(title, defaultValue, onOk) {
  openModal(`
    <h3>${escapeHtml(title)}</h3>
    <input id="input-dlg" value="${escapeHtml(defaultValue||"")}" />
    <div class="actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" id="input-ok">OK</button>
    </div>
  `);
  const inp = document.getElementById("input-dlg");
  inp.focus(); inp.select();
  const submit = () => {
    const v = inp.value;
    closeModal();
    onOk(v);
  };
  document.getElementById("input-ok").onclick = submit;
  inp.onkeydown = (e) => { if (e.key === "Enter") submit(); };
}
function confirmDialog(message, onYes) {
  openModal(`
    <h3>${escapeHtml(message)}</h3>
    <div class="actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" id="confirm-ok">OK</button>
    </div>
  `);
  document.getElementById("confirm-ok").onclick = () => { closeModal(); onYes(); };
}

function openModal(html) {
  document.getElementById("modal").innerHTML = html;
  document.getElementById("modal-bg").classList.add("open");
}
function closeModal() { document.getElementById("modal-bg").classList.remove("open"); }

function pickMember(title, onPick, exclude=[]) {
  // state.members と MEMBER_INFO 両方からマージ。削除済みは除外。
  const set = new Set();
  state.members.forEach(n => { if (!isDeleted(n)) set.add(n); });
  Object.keys(MEMBER_INFO).forEach(n => {
    if (isDeleted(n)) return;
    const alt = n.replace(/﨑/g, "崎");
    const alt2 = n.replace(/崎/g, "﨑");
    if (!set.has(n) && !set.has(alt) && !set.has(alt2)) set.add(n);
  });
  const list = [...set]
    .filter(n => !exclude.includes(n))
    .sort((a,b) => a.localeCompare(b,"ja"));
  openModal(`
    <h3>${title}</h3>
    <input id="pick-search" placeholder="検索…" oninput="filterPicks()"/>
    <div id="pick-list">
      ${list.map(n => `<div class="member-pick" data-name="${escapeHtml(n)}" onclick="window.__pick('${n}')">${escapeHtml(n)}</div>`).join("")}
    </div>
    <div style="border-top:1px dashed var(--border);margin-top:8px;padding-top:8px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">一覧にいない場合は新規追加</div>
      <input id="pick-new-name" placeholder="新しいメンバー名を入力"/>
      <button class="btn primary" onclick="window.__addAndPick()" style="width:100%;padding:10px">＋ 新規追加して選択</button>
    </div>
    <div class="actions"><button class="btn" onclick="closeModal()">キャンセル</button></div>
  `);
  window.__pick = (n) => { closeModal(); onPick(n); };
  window.__addAndPick = () => {
    const name = (document.getElementById("pick-new-name").value || "").trim();
    if (!name) return;
    if (!state.members.includes(name)) state.members.push(name);
    closeModal();
    onPick(name);
  };
  window.filterPicks = () => {
    const q = document.getElementById("pick-search").value.trim();
    document.querySelectorAll("#pick-list .member-pick").forEach(el => {
      el.style.display = (!q || el.dataset.name.includes(q)) ? "" : "none";
    });
  };
}
